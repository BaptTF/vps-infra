tolerations:
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    effect: NoSchedule
  # Spare personal servers (tag:server) are tainted dedicated=spare:NoSchedule.
  - key: dedicated
    operator: Equal
    value: spare
    effect: NoSchedule

configuration:
  period: 15m
  startTime: "08:30"
  endTime: "10:30"
  timeZone: Europe/Paris
  drainTimeout: 3m
  forceReboot: true
  concurrency: 1
  annotateNodes: true
  preRebootNodeLabels:
    - kured=rebooting
  postRebootNodeLabels:
    - kured=done

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
