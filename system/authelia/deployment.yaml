apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: authelia
  labels:
    app: authelia
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: debian-16gb-hel1-2
      containers:
        - name: authelia
          image: authelia/authelia:4.39.28
          ports:
            - name: http
              containerPort: 9091
            - name: metrics
              containerPort: 9959
          env:
            - name: X_AUTHELIA_CONFIG_FILTERS
              value: template
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: storage-encryption-key
            - name: AUTHELIA_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: session-secret
            - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: jwt-secret
            - name: AUTHELIA_STORAGE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authelia-db-secret
                  key: password
            - name: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lldap-auth-secret
                  key: ldap-user-pass
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: oidc-secrets
              mountPath: /config/secrets
              readOnly: true
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
          livenessProbe:
            httpGet:
              path: /api/health
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: authelia-config
        # Single projected volume: no subPath nested inside a read-only secret volume
        - name: oidc-secrets
          projected:
            sources:
              - secret:
                  name: authelia-secrets
                  items:
                    - key: oidc-hmac-secret
                      path: oidc-hmac-secret
                    - key: oidc-jwks-private-key
                      path: oidc-jwks-private-key
                    - key: immich-oidc-client-secret-hash
                      path: immich-oidc-client-secret-hash
                    - key: vikunja-oidc-client-secret-hash
                      path: vikunja-oidc-client-secret-hash
              - secret:
                  name: resend
                  items:
                    - key: api-key
                      path: notifier-smtp-password
