apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: authelia-config
    namespace: authelia
    files:
      - configuration.yml
  - name: authelia-valkey-config
    namespace: authelia
    files:
      - valkey.conf

resources:
  - infisical-secret.yaml
  - deployment.yaml
  - valkey-pvc.yaml
  - valkey-deployment.yaml
  - valkey-service.yaml
  - service.yaml
  - ingressroute.yaml
  - middleware.yaml
  - networkpolicy.yaml
