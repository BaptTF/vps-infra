# enablePodMonitor is deprecated and silently skipped when the operator starts before the Prometheus Operator CRDs.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres-cluster
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: immich-postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: immich-postgres
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
