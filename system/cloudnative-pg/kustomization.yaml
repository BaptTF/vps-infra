apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnpg-system

helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.29.1
    releaseName: cnpg
    namespace: cnpg-system
    valuesInline:
      monitoring:
        podMonitorEnabled: true
        grafanaDashboard:
          create: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
  - name: plugin-barman-cloud
    repo: https://cloudnative-pg.github.io/charts
    version: 0.8.1
    releaseName: plugin-barman-cloud
    namespace: cnpg-system
    valuesInline:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

resources:
  - cnpg-cluster.yaml
  - immich-postgres-cluster.yaml
  - immich-database.yaml
  - databases.yaml
  - database-infisical-secrets.yaml
  - immich-db-infisical-secret.yaml
  - backup-infisical-secret.yaml
  - objectstore.yaml
  - scheduled-backup.yaml
  - immich-scheduled-backup.yaml
  - grokbot-backup-restore-rbac.yaml

# A bulk revert must drop `plugins:` from the Clusters before the plugin goes away,
# and the CRD must never be pruned (it would cascade to the ObjectStore).
patches:
  - target:
      kind: CustomResourceDefinition
      name: objectstores.barmancloud.cnpg.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: objectstores.barmancloud.cnpg.io
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  - target:
      name: ".*barman-cloud.*"
    patch: |-
      apiVersion: v1
      kind: Placeholder
      metadata:
        name: placeholder
        annotations:
          argocd.argoproj.io/sync-options: PruneLast=true
