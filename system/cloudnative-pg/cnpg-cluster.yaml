apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: cnpg-system
spec:
  instances: 1
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  # backup/WAL archiving to R2 disabled: same R2 403 as immich-postgres,
  # ~5.7Gi unreclaimable local pg_wal. Re-enable with fixed credentials
  # and short retention after immich-postgres is healthy again.

  managed:
    roles:
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: forgejo
        login: true
        passwordSecret:
          name: forgejo-db-secret
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: jujudb
        login: true
        passwordSecret:
          name: jujudb-db-secret
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: lacoope
        login: true
        passwordSecret:
          name: lacoope-db-secret
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: openwebui
        login: true
        passwordSecret:
          name: openwebui-db-secret
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: authelia
        login: true
        passwordSecret:
          name: authelia-db-secret
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: lldap
        login: true
        passwordSecret:
          name: lldap-db-secret
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: tripkit
        login: true
        passwordSecret:
          name: tripkit-db-secret
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: sickgnal
        login: true
        passwordSecret:
          name: sickgnal-db-secret
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: compreface
        login: true
        passwordSecret:
          name: compreface-db-secret
