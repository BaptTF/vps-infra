apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 1
  monitoring:
    enablePodMonitor: true
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # Defaulted by the CNPG webhook; set here to keep Argo CD in sync.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-r2
        serverName: postgres-cluster

  managed:
    roles:
      - name: forgejo
        ensure: absent
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: jujudb
        login: true
        passwordSecret:
          name: jujudb-db-secret
      - name: lacoope
        ensure: absent
      - name: openwebui
        ensure: absent
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: authelia
        login: true
        passwordSecret:
          name: authelia-db-secret
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: lldap
        login: true
        passwordSecret:
          name: lldap-db-secret
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: tripkit
        login: true
        passwordSecret:
          name: tripkit-db-secret
      - name: sickgnal
        ensure: absent
      - name: compreface
        ensure: absent
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: vikunja
        login: true
        passwordSecret:
          name: vikunja-db-secret
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: vaultwarden
        login: true
        passwordSecret:
          name: vaultwarden-db-secret
