apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.10-1.1.1
  storage:
    size: 10Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
  # backup/WAL archiving to R2 disabled: archive was failing (R2 403) and
  # retained ~59Gi of unreclaimable local pg_wal. Re-enable with fixed
  # credentials, weekly schedule, and short retention (e.g. 14d).
  managed:
    roles:
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: immich
        login: true
        superuser: true
        passwordSecret:
          name: immich-db-secret
