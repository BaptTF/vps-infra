apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 1
  monitoring:
    enablePodMonitor: true
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1
  storage:
    size: 10Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-r2
        serverName: immich-postgres
  managed:
    roles:
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: immich
        login: true
        superuser: true
        passwordSecret:
          name: immich-db-secret
