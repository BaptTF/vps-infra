apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: traefik

helmCharts:
  - name: traefik
    repo: https://helm.traefik.io/traefik
    version: 41.6.0
    releaseName: traefik
    namespace: traefik
    includeCRDs: true
    valuesFile: values.yaml

resources:
  - certificate.yaml
