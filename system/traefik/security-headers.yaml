# Applied to every router on websecure (ports.websecure.middlewares in values.yaml).
# Only headers no app depends on: framing and CSP stay with each app.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: traefik
spec:
  headers:
    stsSeconds: 31536000
    contentTypeNosniff: true
