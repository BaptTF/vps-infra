# Traefik values for k3s
# https://github.com/traefik/traefik-helm-chart
# Schema-aligned for chart 41.4.0 (additionalProperties: false at root)

# Service configuration
service:
  spec:
    type: LoadBalancer

# EntryPoints configuration
ports:
  web:
    port: 80
    expose:
      default: true
    exposedPort: 80
    transport:
      respondingTimeouts:
        readTimeout: 600s
        idleTimeout: 600s
  websecure:
    port: 443
    expose:
      default: true
    exposedPort: 443
    # Default readTimeout is 60s; raise for slow/large uploads (e.g. Immich).
    transport:
      respondingTimeouts:
        readTimeout: 600s
        idleTimeout: 600s
  ssh:
    port: 22
    expose:
      default: true
    exposedPort: 22
    protocol: TCP

# Providers configuration
# Instructs Traefik to publish its LoadBalancer IP to standard Ingress resources.
# This ensures tools like ArgoCD can accurately read the Ingress health status.
providers:
  kubernetesIngress:
    publishedService:
      enabled: true
  kubernetesCRD:
    allowCrossNamespace: true
    allowExternalNameServices: true

# IngressClass configuration
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

# Dashboard disabled - use Prometheus/Grafana metrics instead
api:
  dashboard: false

# Logs configuration
log:
  level: INFO
accessLog:
  enabled: true

# Metrics configuration
# Prometheus is enabled by default when the prometheus key is non-null.
# ServiceMonitor must nest under metrics.prometheus (chart 41.x).
metrics:
  prometheus:
    addRoutersLabels: true
    addEntryPointsLabels: true
    addServicesLabels: true
    serviceMonitor:
      enabled: true

# Resource limits
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"
