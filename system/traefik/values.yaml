# Traefik values for k3s
# https://github.com/traefik/traefik-helm-chart
# Chart 41.x schema: unknown root keys are rejected.

service:
  spec:
    type: LoadBalancer

ports:
  web:
    port: 80
    expose:
      default: true
    exposedPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    transport:
      respondingTimeouts:
        readTimeout: 600s
        idleTimeout: 600s
  websecure:
    port: 443
    expose:
      default: true
    exposedPort: 443
    # Default readTimeout is 60s; raise for slow/large uploads (e.g. Immich).
    transport:
      respondingTimeouts:
        readTimeout: 600s
        idleTimeout: 600s
  ssh:
    port: 22
    expose:
      default: true
    exposedPort: 22
    protocol: TCP

providers:
  kubernetesIngress:
    publishedService:
      enabled: true
  kubernetesCRD:
    allowCrossNamespace: true
    allowExternalNameServices: true

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

ingressRoute:
  dashboard:
    enabled: false

log:
  level: INFO

accessLog:
  enabled: true

metrics:
  prometheus:
    addRoutersLabels: true
    addEntryPointsLabels: true
    addServicesLabels: true

tlsStore:
  default:
    defaultCertificate:
      secretName: wildcard-bapttf-tls

extraObjects:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: wildcard-bapttf
    spec:
      secretName: wildcard-bapttf-tls
      issuerRef:
        name: letsencrypt-prod
        kind: ClusterIssuer
      dnsNames:
        - bapttf.com
        - "*.bapttf.com"

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"
