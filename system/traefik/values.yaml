# Traefik values for k3s
# https://github.com/traefik/traefik-helm-chart
# Chart 41.x schema: unknown root keys are rejected.

service:
  spec:
    type: LoadBalancer

ports:
  web:
    port: 80
    expose:
      default: true
    exposedPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    transport:
      respondingTimeouts:
        readTimeout: 600s
        idleTimeout: 600s
  websecure:
    port: 443
    expose:
      default: true
    exposedPort: 443
    http:
      middlewares:
        - traefik-security-headers@kubernetescrd
    # Default readTimeout is 60s; raise for slow/large uploads (e.g. Immich).
    transport:
      respondingTimeouts:
        readTimeout: 600s
        idleTimeout: 600s

providers:
  kubernetesIngress:
    publishedService:
      enabled: true
  kubernetesCRD:
    allowCrossNamespace: true
    allowExternalNameServices: true

ingressClass:
  enabled: true
  # An Ingress without ingressClassName must not become public.
  isDefaultClass: false
  name: traefik

ingressRoute:
  dashboard:
    enabled: false

log:
  level: INFO

accessLog:
  enabled: true

metrics:
  prometheus:
    addRoutersLabels: true
    addEntryPointsLabels: true
    addServicesLabels: true
    service:
      enabled: true

tlsStore:
  default:
    defaultCertificate:
      secretName: wildcard-bapttf-tls

# Only Cloudflare may reach the origin: it presents the Authenticated Origin Pulls
# client certificate. immich and drive are DNS-only (uploads above the Cloudflare
# free plan limit) and select the `direct` option in their IngressRoute.
tlsOptions:
  default:
    minVersion: VersionTLS12
    clientAuth:
      secretNames:
        - cloudflare-origin-pull-ca
      clientAuthType: RequireAndVerifyClientCert
  direct:
    minVersion: VersionTLS12

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

deployment:
  replicas: 2

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: '{{ template "traefik.name" . }}'
        app.kubernetes.io/instance: '{{ .Release.Name }}-{{ include "traefik.namespace" . }}'
    matchLabelKeys:
      - pod-template-hash

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
