# One CR per namespace. creationPolicy Owner sets an ownerReference, and
# Kubernetes rejects an owner in a different namespace.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: k8up-restic-sync
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: https://app.infisical.com/api
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: infrastructure
        envSlug: prod
        secretsPath: /k8up
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: k8up-restic
      secretNamespace: immich
      secretType: Opaque
      creationPolicy: Owner
