# Originals on the Hetzner Storage Box. Sub-repository of user k3s, so the
# Pi prune of /k3s does not load this index. Same htpasswd user. The cluster
# reaches the NAS through a DERP relay for now.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: storagebox-backup
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-photos
      key: RESTIC_PASSWORD
    rest:
      url: http://dsplay.tail4c7c90.ts.net:8000/k3s/photos
      userSecretRef:
        name: k8up-restic
        key: REST_USERNAME
      passwordSecretReg:
        name: k8up-restic
        key: REST_PASSWORD
  backup:
    labelSelectors:
      - matchLabels:
          backup.bapttf.com/repository: photos
    schedule: "0 4 * * *"
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 4Gi
