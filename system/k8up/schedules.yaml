# Daily PVC backup to the NAS rest-server. Prune and check are omitted:
# the append-only listener rejects them, and the Pi runs them through :8001.
# Schedules are staggered (k8up runs in UTC) so that only one restic client
# talks to the 1 GB NAS at a time: small apps 00:00-00:50, vaultwarden 00:50
# (~75 min), immich-library 02:30, photos (storagebox) last at 05:30.
# Concurrent runs on 2026-10-24 OOM-killed tailscaled on the NAS.
# passwordSecretReg is the CRD field name. The typo is the published API.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: pvc-backup
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic
      key: RESTIC_PASSWORD
    rest:
      url: http://dsplay.tail4c7c90.ts.net:8000/k3s
      userSecretRef:
        name: k8up-restic
        key: REST_USERNAME
      passwordSecretReg:
        name: k8up-restic
        key: REST_PASSWORD
  backup:
    # immich-storagebox is the only other annotated PVC here. It has its own
    # schedule and repository, so this one must not pick it up.
    labelSelectors:
      - matchLabels:
          backup.bapttf.com/repository: k3s
    schedule: "30 2 * * *"
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 1
---
