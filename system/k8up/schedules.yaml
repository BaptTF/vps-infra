# Originals on the Hetzner Storage Box. Sub-repository of user k3s, so the
# Pi prune of /k3s does not load this index. Same htpasswd user. The cluster
# reaches the NAS through a DERP relay for now.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: storagebox-backup
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-photos
      key: RESTIC_PASSWORD
    rest:
      url: http://dsplay.tail4c7c90.ts.net:8000/k3s/photos
      userSecretRef:
        name: k8up-restic
        key: REST_USERNAME
      passwordSecretReg:
        name: k8up-restic
        key: REST_PASSWORD
  backup:
    labelSelectors:
      - matchLabels:
          backup.bapttf.com/repository: photos
    schedule: "30 5 * * *"
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 4Gi
---
# NAS archives (/nas/archives, ~800 GB over SMB). Own repository and weekly
# schedule: a full re-read takes ~1 day at ~8 MB/s (photos repo: 459 GB in
# 16.5 h), so a daily run would overlap every other backup on the 1 GB NAS.
# Saturday 18:00 UTC, after storagebox-backup (05:30, ~12 h) has finished.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: archives-backup
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-restic-photos
      key: RESTIC_PASSWORD
    rest:
      url: http://dsplay.tail4c7c90.ts.net:8000/k3s/archives
      userSecretRef:
        name: k8up-restic
        key: REST_USERNAME
      passwordSecretReg:
        name: k8up-restic
        key: REST_PASSWORD
  backup:
    labelSelectors:
      - matchLabels:
          backup.bapttf.com/repository: archives
    schedule: "0 18 * * 6"
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 4Gi
