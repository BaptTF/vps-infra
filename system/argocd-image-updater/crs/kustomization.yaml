# system/argocd-image-updater/crs/kustomization.yaml
# ImageUpdater CRs for first-party apps (direct write-back to main).
# Third-party image updates are handled by Renovate PRs (see renovate.json).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - ai-platform-ghcr-secret.yaml
  - ai-usage-exporter-updater.yaml
  - bapttf-front-updater.yaml
  - dashboard-infra-updater.yaml
  - assisted-teacher-updater.yaml
  - bifrost-updater.yaml
  - jujudb-updater.yaml
  - hermes-lya-updater.yaml
  - kirocrew-updater.yaml
  - opencode-dashboard-updater.yaml
  - tripkit-frontend-updater.yaml
  - tripkit-backend-updater.yaml
  - voyage-updater.yaml
  - vulcain-updater.yaml
