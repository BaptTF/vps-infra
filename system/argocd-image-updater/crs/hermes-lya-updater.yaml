apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: hermes-lya-updater
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: agents
      images:
        - alias: hermes-lya
          imageName: ghcr.io/rjullien/hermes-lya-config
          commonUpdateSettings:
            updateStrategy: newest-build
            # Only calver release tags; excludes sha-*, sha256-* (attestations), latest, vYYYY.M
            allowTags: "regexp:^v[0-9]+\\.[0-9]+\\.[0-9]+(\\.[0-9]+)?$"
  writeBackConfig:
    method: "git:secret:argocd/argocd-image-updater-git-creds"
    gitConfig:
      branch: main