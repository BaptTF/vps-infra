apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: vulcain-updater
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: vulcain
      images:
        - alias: vulcain
          imageName: ghcr.io/bapttf/vulcain
          commonUpdateSettings:
            updateStrategy: newest-build
  writeBackConfig:
    method: "git:secret:argocd/argocd-image-updater-git-creds"
    gitConfig:
      branch: main
