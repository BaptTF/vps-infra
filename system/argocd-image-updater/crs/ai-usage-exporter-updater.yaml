apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: ai-usage-exporter-updater
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: ai-usage-exporter
      images:
        - alias: ai-usage-exporter
          imageName: ghcr.io/bapttf/ai-usage-exporter
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^sha-[0-9a-f]{7}$"
            pullSecret: pullsecret:argocd/ai-platform-ghcr-login-secret
  writeBackConfig:
    method: "git:secret:argocd/argocd-image-updater-git-creds"
    gitConfig:
      branch: main
