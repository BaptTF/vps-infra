apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: hermes-leo-updater
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: agents
      images:
        - alias: hermes-leo
          imageName: ghcr.io/rjullien/hermes-leo-config/hermes-leo-custom
          commonUpdateSettings:
            updateStrategy: newest-build
            # Only calver release tags (vX.Y.Z[.W]); excludes sha-*, sha256-*, latest
            allowTags: "regexp:^v[0-9]+\\.[0-9]+\\.[0-9]+(\\.[0-9]+)?$"
  writeBackConfig:
    method: "git:secret:argocd/argocd-image-updater-git-creds"
    gitConfig:
      branch: main