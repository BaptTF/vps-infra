# system/argocd-image-updater/base/kustomization.yaml
# ArgoCD Image Updater controller and infrastructure
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  # Install ArgoCD Image Updater from official manifests, pinned to a release
  # (Renovate bumps the tag). This controller pushes to main: a moving branch
  # would let upstream change its RBAC or image without review.
  - https://raw.githubusercontent.com/argoproj-labs/argocd-image-updater/v1.4.0/config/install.yaml
  # Git credentials for write-back
  - infisical-secret.yaml

patches:
  - target:
      kind: Deployment
      name: argocd-image-updater
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
  # Allow Prometheus (namespace monitoring) to scrape the controller metrics.
  # Upstream policy only admits namespaces labelled metrics=enabled.
  - target:
      kind: NetworkPolicy
      name: allow-metrics-traffic
    patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: monitoring
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
          ports:
            - port: 8443
              protocol: TCP
