# local-path PVC disk usage. One pod per node, no hostNetwork.
# /var/lib/rancher/k3s/storage is mounted read-only. The directory cache
# is an emptyDir; the root filesystem stays read-only.
# Image tag v0.1.4 is published by a git tag on Louclaw/local-path-exporter.
# It does not exist until that tag is pushed. Default pull policy is IfNotPresent.
# Do not merge until ghcr.io/louclaw/local-path-exporter:v0.1.4 is published.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: local-path-exporter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-exporter
  labels:
    app.kubernetes.io/name: local-path-exporter
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-exporter
  labels:
    app.kubernetes.io/name: local-path-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-exporter
subjects:
  - kind: ServiceAccount
    name: local-path-exporter
    namespace: monitoring
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: local-path-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: local-path-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: local-path-exporter
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-path-exporter
    spec:
      serviceAccountName: local-path-exporter
      # Informers on PV and PVC.
      automountServiceAccountToken: true
      hostNetwork: false
      hostPID: false
      hostIPC: false
      # k3s taints the server with control-plane (and master on older releases).
      # The worker is untainted. These two let the DaemonSet run on both nodes.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      # UID 0: with allowPrivilegeEscalation false, a non-root user never
      # gets DAC_READ_SEARCH in the effective set, so mode 0700 volumes stay unreadable.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Name matches the kubelet container label excluded from
        # ContainerMemoryNearLimit. The image's example uses "exporter".
        - name: local-path-exporter
          image: ghcr.io/louclaw/local-path-exporter:v0.1.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: STORAGE_PATH
              value: /var/lib/rancher/k3s/storage
            - name: METRICS_ADDR
              value: ":9100"
            - name: SCAN_INTERVAL
              value: 5m
            - name: SCAN_TIMEOUT
              value: 2m
            - name: SCAN_PARALLELISM
              value: "1"
            # Each 50000 tracked entries adds one SCAN_INTERVAL, capped
            # by the full-scan period. The memory limit stays 128Mi.
            - name: SCAN_ENTRIES_PER_STEP
              value: "50000"
            # Allowed range is 6h to 24h. In-place rewrites wait for this.
            - name: FULL_SCAN_INTERVAL
              value: 6h
            # Per-directory records only. 8MiB dropped the large volumes.
            # 32MiB keeps about 1.6M entries. The cgroup limit stays 128Mi.
            - name: SCAN_CACHE_MAX_BYTES
              value: "33554432"
            # Writable emptyDir. A restart reloads this file instead of a full scan.
            - name: SCAN_CACHE_PATH
              value: /var/lib/local-path-exporter/cache.v1
            # Pause a full scan while memory.current stays above ~100Mi.
            # 0 disables. The 128Mi limit is unchanged.
            # Pauses are expected on every full scan (about four minutes for
            # 1M entries, then zero on the incremental cycles). No alert:
            # the counter moves on the healthy path.
            - name: SCAN_THROTTLE_HIGH
              value: "104857600"
            - name: SCAN_THROTTLE_BATCH
              value: "2048"
            # Bounds the Go heap only. Kernel slab is what approaches 128Mi.
            # memory.reclaim stays EROFS on this non-privileged pod.
            - name: GOMEMLIMIT
              value: "100MiB"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: storage
              mountPath: /var/lib/rancher/k3s/storage
              readOnly: true
            - name: cache
              mountPath: /var/lib/local-path-exporter
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
      volumes:
        - name: storage
          hostPath:
            path: /var/lib/rancher/k3s/storage
            type: Directory
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: local-path-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: local-path-exporter
    # ServiceMonitor jobLabel reads this. Job name must not be "kubelet".
    prometheus-job: local-path-exporter
spec:
  selector:
    app.kubernetes.io/name: local-path-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
# Prometheus CR selectors are empty, so no release label is required.
# job="local-path-exporter" keeps these series out of kubelet rules:
# both jobs emit kubelet_volume_stats_*, with different meanings.
# honorLabels keeps namespace, persistentvolume, and node from the exporter.
# Endpoint and relabel fields below are the values the API or Prometheus
# otherwise fill in (scheme http, action replace, regex (.*), separator ";",
# replacement $1). The ServiceMonitor CRD in kube-prometheus-stack 92.14.0
# only defaults relabelings[].action. The rest are spelled out so a live
# object that already carries them matches git. ignoreDifferences stays
# limited to fields a controller rewrites, such as Tailscale externalName.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: local-path-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: local-path-exporter
spec:
  jobLabel: prometheus-job
  selector:
    matchLabels:
      app.kubernetes.io/name: local-path-exporter
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 60s
      honorLabels: true
      relabelings:
        # Volume series already carry node. This fills it on up and scan metrics.
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          separator: ";"
          regex: "(.*)"
          targetLabel: node
          replacement: "$1"
          action: replace
---
# Match job="local-path-exporter" only. The kubelet job reports the node
# filesystem for local-path volumes, not the PVC directory.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: local-path-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: local-path-exporter
spec:
  groups:
    - name: local-path-exporter
      rules:
        - alert: LocalPathPVCOverRequested
          expr: |
            (
              kubelet_volume_stats_used_bytes{job="local-path-exporter"}
              >
              kubelet_volume_stats_capacity_bytes{job="local-path-exporter"}
            )
            and
            kubelet_volume_stats_capacity_bytes{job="local-path-exporter"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} on {{ $labels.node }} exceeds its requested size"
            description: "On-disk usage of {{ $labels.persistentvolume }} is above the PVC storage request. local-path does not enforce that request."
        - alert: LocalPathPVCGrowingFast
          expr: |
            (
              predict_linear(kubelet_volume_stats_used_bytes{job="local-path-exporter"}[6h], 24 * 3600)
              >
              kubelet_volume_stats_capacity_bytes{job="local-path-exporter"}
            )
            and
            (
              kubelet_volume_stats_used_bytes{job="local-path-exporter"}
              <
              kubelet_volume_stats_capacity_bytes{job="local-path-exporter"}
            )
            and
            kubelet_volume_stats_capacity_bytes{job="local-path-exporter"} > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} on {{ $labels.node }} may exceed its request within a day"
            description: "predict_linear over 6h crosses the storage request of {{ $labels.persistentvolume }} in 24h."
        - alert: LocalPathExporterDown
          expr: up{job="local-path-exporter"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "local-path-exporter on {{ $labels.node }} is down"
            description: "Scrape target {{ $labels.instance }} is down."
        - alert: LocalPathExporterScanStale
          expr: time() - local_path_exporter_scan_last_success_timestamp_seconds{job="local-path-exporter"} > 1200
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "local-path-exporter on {{ $labels.node }} has not finished a scan"
            description: "No successful scan for 20m (interval is 5m). A cycle where every volume fails does not refresh this timestamp."
        - alert: LocalPathExporterScanErrors
          expr: increase(local_path_exporter_scan_errors_total{job="local-path-exporter"}[30m]) > 2
          labels:
            severity: warning
          annotations:
            summary: "local-path-exporter on {{ $labels.node }} is failing scans"
            description: "Volume timeouts and I/O errors keep the previous sample and increment local_path_exporter_scan_errors_total."
        # Above 4m for 15m. The interval is 5m and each PVC walk is capped by SCAN_TIMEOUT (2m),
        # so this is a cycle that stays slow across consecutive intervals, not one long directory.
        - alert: LocalPathExporterScanSlow
          expr: local_path_exporter_scan_duration_seconds{job="local-path-exporter"} > 240
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "local-path-exporter scan on {{ $labels.node }} is slow"
            description: "The last cycle took more than 4 minutes. The interval is 5 minutes, and each PVC walk is capped by SCAN_TIMEOUT."
        # Reclaimable slab is the usual charge near 128Mi and is not an OOM.
        # 80Mi of anon plus unreclaimable slab, for 15m.
        - alert: LocalPathExporterMemoryHigh
          expr: |
            (
              local_path_exporter_cgroup_anon_bytes{job="local-path-exporter"}
              +
              local_path_exporter_cgroup_slab_unreclaimable_bytes{job="local-path-exporter"}
            ) > 80 * 1024 * 1024
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "local-path-exporter on {{ $labels.node }} holds more than 80Mi of anonymous and unreclaimable memory"
            description: "Anonymous memory plus unreclaimable slab is above 80Mi. Reclaimable slab and file cache are not counted."
