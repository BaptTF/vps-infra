# Long-term Prometheus: one year of the application metrics, copied from the main
# Prometheus through /federate. Applications keep their 30s resolution; Home
# Assistant and node-exporter (the biggest jobs) are copied every 5 minutes.
# Kubernetes internals (kubelet, apiserver, kube-state-metrics) are not copied.
# Add a job to one of the ScrapeConfigs below to keep it for a year.
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: longterm
  namespace: monitoring
spec:
  replicas: 1
  retention: 365d
  # ~26-35 GB/year at the intervals below; the size cap only guards the 50Gi PVC.
  retentionSize: 45GB
  scrapeInterval: 5m
  evaluationInterval: 5m
  # The 5-minute jobs have one sample every 5 minutes: the default 5m lookback would leave gaps.
  query:
    lookbackDelta: 15m
  scrapeConfigSelector:
    matchLabels:
      prometheus: longterm
  # Same node as the main Prometheus: local-path PVC, Hetzner disk is short.
  nodeSelector:
    kubernetes.io/hostname: vmi2735515.contaboserver.net
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
    limits:
      memory: 768Mi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
---
# The ScrapeConfigs are not selected by the main Prometheus (its scrapeConfigSelector is release=kps).
# Applications (~16k series): full 30s resolution.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: longterm-federate-30s
  namespace: monitoring
  labels:
    prometheus: longterm
spec:
  metricsPath: /federate
  honorLabels: true
  scrapeInterval: 30s
  scrapeTimeout: 25s
  params:
    "match[]":
      - '{job=~"bifrost|hermes-leo|hermes-lea|cnpg-system/.*|k8up-metrics|vikunja|authelia|camille|searxng|cloudflare-exporter|snmp-dsplay|homeassistant-livebox|local-path-exporter|immich-server|immich-microservices|traefik-metrics"}'
      - '{__name__=~"ai_usage_.*|bifrost_provider_key_weight|bifrost_weight_sidecar_observation_success|bifrost_weight_sidecar_last_observation_timestamp_seconds"}'
  staticConfigs:
    - targets:
        - kps-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
---
# Home Assistant and node-exporter (~29k series): one sample every 5 minutes.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: longterm-federate-5m
  namespace: monitoring
  labels:
    prometheus: longterm
spec:
  metricsPath: /federate
  honorLabels: true
  scrapeInterval: 5m
  scrapeTimeout: 2m
  params:
    "match[]":
      - '{job=~"homeassistant|homeassistant-eyg|node-exporter"}'
  staticConfigs:
    - targets:
        - kps-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
---
# prometheus-operated selects every Prometheus of the namespace; the Tailscale ingress needs this one only.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-longterm
  namespace: monitoring
spec:
  selector:
    operator.prometheus.io/name: longterm
  ports:
    - name: web
      port: 9090
      targetPort: web
