apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sre-agent
  namespace: monitoring
spec:
  groups:
    - name: sre-cnpg
      rules:
        - alert: CnpgCollectorDown
          expr: cnpg_collector_up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CNPG collector down on {{ $labels.pod }}"
            description: "The CNPG metrics collector cannot query PostgreSQL on {{ $labels.pod }} ({{ $labels.cluster }})."
        # Archiving goes through the Barman Cloud plugin; pg_stat_archiver still reflects its result.
        - alert: CnpgWalArchiveFailing
          expr: increase(cnpg_pg_stat_archiver_failed_count[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "WAL archiving failing on {{ $labels.pod }}"
            description: "{{ $value | humanize }} WAL archive failures in the last 15 minutes on {{ $labels.pod }}."
        - alert: CnpgWalArchiveBacklog
          expr: cnpg_collector_pg_wal_archive_status{value="ready"} > 10
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "WAL files piling up on {{ $labels.pod }}"
            description: "{{ $value }} WAL segments waiting to be archived on {{ $labels.pod }}."
        - alert: CnpgConnectionsNearMax
          expr: |
            sum by (namespace, pod) (cnpg_backends_total)
              / on (namespace, pod) max by (namespace, pod) (cnpg_pg_settings_setting{name="max_connections"}) > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} is near max_connections"
            description: "{{ $value | humanizePercentage }} of max_connections in use on {{ $labels.pod }}."
        - alert: CnpgLongRunningTransaction
          expr: max by (namespace, pod, datname, usename) (cnpg_backends_max_tx_duration_seconds) > 1800
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Long transaction on {{ $labels.pod }}/{{ $labels.datname }}"
            description: "A transaction by {{ $labels.usename }} has been open for {{ $value | humanizeDuration }}."
    - name: sre-backups
      rules:
        # Plugin metrics carry no cluster label: derive it from the pod name.
        # A value of 0 means no backup recorded yet, so a never-backed-up cluster fires.
        - alert: CnpgBackupTooOld
          expr: |
            time() - max by (namespace, cluster) (
              label_replace(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp, "cluster", "$1", "pod", "(.+)-[0-9]+")
            ) > 8 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No recent base backup for {{ $labels.cluster }}"
            description: "Last successful base backup is {{ $value | humanizeDuration }} old; the schedule is weekly."
        - alert: CnpgBackupFailed
          expr: |
            max by (namespace, cluster) (label_replace(barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp, "cluster", "$1", "pod", "(.+)-[0-9]+"))
              > max by (namespace, cluster) (label_replace(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp, "cluster", "$1", "pod", "(.+)-[0-9]+"))
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Last base backup of {{ $labels.cluster }} failed"
            description: "The most recent backup attempt failed after the last successful one."
        # 14d retention plus one weekly cycle: anything older means retention is not pruning R2.
        - alert: CnpgRecoveryPointTooOld
          expr: |
            time() - max by (namespace, cluster) (
              label_replace(barman_cloud_cloudnative_pg_io_first_recoverability_point, "cluster", "$1", "pod", "(.+)-[0-9]+") > 0
            ) > 23 * 86400
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "Retention not applied for {{ $labels.cluster }}"
            description: "First recoverability point is {{ $value | humanizeDuration }} old, beyond the 14d policy."
        # Without plugin metrics the alerts above stay silent.
        - alert: CnpgBackupMetricsMissing
          expr: |
            max by (namespace, cluster) (cnpg_collector_up)
              unless on (namespace, cluster)
            max by (namespace, cluster) (label_replace(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp, "cluster", "$1", "pod", "(.+)-[0-9]+"))
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "No Barman Cloud metrics for {{ $labels.cluster }}"
            description: "The cluster is scraped but the plugin reports nothing; backup alerts cannot fire."
        # -1 means the archiver stats were reset or nothing was ever archived.
        - alert: CnpgWalArchiveStalled
          expr: |
            (cnpg_pg_stat_archiver_seconds_since_last_archival > 3600 or cnpg_pg_stat_archiver_seconds_since_last_archival < 0)
              and on (namespace, pod) cnpg_collector_pg_wal_archive_status{value="ready"} > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "WAL archiving stalled on {{ $labels.pod }}"
            description: "WAL segments are waiting and nothing was archived recently."
        # Direct guard for the node disk: local-path does not enforce the PVC size.
        - alert: CnpgWalDirectoryLarge
          expr: cnpg_collector_pg_wal{value="size"} > 2 * 1024 * 1024 * 1024
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "pg_wal is large on {{ $labels.pod }}"
            description: "{{ $value | humanize1024 }}B in pg_wal. If R2 is unreachable, removing `plugins:` from the Cluster frees it."
        # The bucket is capped at 10 GB; R2 analytics lag by up to an hour.
        - alert: R2BackupBucketNearFull
          expr: max by (bucket) (cloudflare_r2_storage_bytes{bucket="cnpg-backups"}) > 9e9
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "R2 bucket {{ $labels.bucket }} above 9 GB"
            description: "{{ $value | humanize }}B stored in {{ $labels.bucket }}."
        - alert: R2BucketSizeMissing
          expr: absent(cloudflare_r2_storage_bytes{bucket="cnpg-backups"})
          for: 3h
          labels:
            severity: warning
          annotations:
            summary: "No R2 size metric for cnpg-backups"
            description: "cloudflare-exporter never reported the bucket; check its token."
        # The exporter keeps its last value when Cloudflare fails, so watch the target itself.
        - alert: CloudflareExporterDown
          expr: absent(up{job="cloudflare-exporter"} == 1)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "cloudflare-exporter is down"
            description: "No healthy scrape for 30 minutes; the R2 size alert is running on stale data."
    - name: sre-cert-manager
      rules:
        - alert: CertificateExpiringSoon
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires soon"
            description: "Expires in {{ $value | humanizeDuration }}; renewal should have happened at 30 days."
        - alert: CertificateNotReady
          expr: certmanager_certificate_ready_status{condition="True"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not Ready"
            description: "cert-manager reports the certificate as not Ready for 15 minutes."
    - name: sre-argocd
      rules:
        - alert: ArgoCDSyncFailed
          expr: increase(argocd_app_sync_total{phase=~"Error|Failed"}[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Argo CD sync failed for {{ $labels.name }}"
            description: "Application {{ $labels.name }} had a sync ending in {{ $labels.phase }} in the last 15 minutes."
    - name: sre-traefik
      rules:
        - alert: TraefikHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (exported_service, le) (rate(traefik_service_request_duration_seconds_bucket[5m]))) > 2
            and sum by (exported_service) (rate(traefik_service_request_duration_seconds_count[5m])) > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "High p95 latency on Traefik service {{ $labels.exported_service }}"
            description: "p95 latency is {{ $value | humanizeDuration }} over 5 minutes."
    - name: sre-homeassistant
      rules:
        - alert: HomeAssistantDown
          expr: up{job=~"homeassistant.*"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Home Assistant {{ $labels.job }} is down"
            description: "Prometheus cannot scrape {{ $labels.job }} for 15 minutes."
    - name: sre-containers
      rules:
        - alert: ContainerMemoryNearLimit
          expr: |
            max by (namespace, pod, container) (container_memory_working_set_bytes{job="kubelet", container!="", container!="POD"})
              / on (namespace, pod, container) max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"}) > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} near memory limit"
            description: "Working set is {{ $value | humanizePercentage }} of the memory limit."
        - alert: ContainerOOMKilled
          expr: |
            (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 15m >= 1)
            and on (namespace, pod, container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} was OOMKilled"
            description: "The container restarted after an OOMKill in the last 15 minutes."
    - name: sre-node-disk
      rules:
        # local-path PVCs share the node disk and don't enforce their size, so alert on the node filesystem.
        - alert: NodeDiskUsageHigh
          expr: |
            1 - node_filesystem_avail_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs", mountpoint="/"}
              / node_filesystem_size_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs", mountpoint="/"} > 0.85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} root disk above 85%"
            description: "{{ $labels.instance }} root filesystem is {{ $value | humanizePercentage }} full."
        - alert: NodeDiskUsageCritical
          expr: |
            1 - node_filesystem_avail_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs", mountpoint="/"}
              / node_filesystem_size_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs", mountpoint="/"} > 0.93
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.instance }} root disk above 93%"
            description: "{{ $labels.instance }} root filesystem is {{ $value | humanizePercentage }} full."
    - name: sre-nas
      rules:
        # DSPlay (643 MiB RAM) swapped hard and OOM-killed tailscaled during restic backups on 2026-10-24.
        # UCD-SNMP-MIB memory values are in kB.
        - alert: NasSwapHigh
          expr: |
            (memTotalSwap{job="snmp-dsplay"} - memAvailSwap{job="snmp-dsplay"})
              / (memTotalSwap{job="snmp-dsplay"} > 0) > 0.7
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "NAS {{ $labels.instance }} swap above 70%"
            description: "{{ $labels.instance }} uses {{ $value | humanizePercentage }} of its swap; the OOM killer may hit tailscaled."
        - alert: NasIowaitHigh
          expr: |
            rate(ssCpuRawWait{job="snmp-dsplay"}[5m])
              / (
                  rate(ssCpuRawUser{job="snmp-dsplay"}[5m])
                + rate(ssCpuRawSystem{job="snmp-dsplay"}[5m])
                + rate(ssCpuRawIdle{job="snmp-dsplay"}[5m])
                + rate(ssCpuRawWait{job="snmp-dsplay"}[5m])
              ) > 0.4
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "NAS {{ $labels.instance }} iowait above 40%"
            description: "{{ $labels.instance }} spends {{ $value | humanizePercentage }} of CPU time waiting on I/O (swap or backup pressure)."
        - alert: NasMemoryLow
          expr: memAvailReal{job="snmp-dsplay"} < 65536
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "NAS {{ $labels.instance }} has less than 64 MiB of free RAM"
            description: "{{ $labels.instance }} memAvailReal is {{ $value }} kB."
