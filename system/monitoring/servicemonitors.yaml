---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: authelia
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [authelia]
  selector:
    matchLabels:
      app: authelia
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [immich]
  selector:
    matchLabels:
      app: immich
      component: server
  endpoints:
    - port: metrics-api
      path: /metrics
      interval: 30s
    - port: metrics-microservices
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vikunja
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [vikunja]
  selector:
    matchLabels:
      app: vikunja
  endpoints:
    - port: http
      path: /api/v1/metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bifrost
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [openclaw]
  selector:
    matchLabels:
      app: bifrost
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: camille
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [camille]
  selector:
    matchLabels:
      app: camille
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-image-updater
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [argocd]
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-image-updater
      control-plane: argocd-image-updater-controller
  endpoints:
    - port: https
      scheme: https
      path: /metrics
      interval: 60s
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-image-updater-metrics-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-image-updater-metrics-reader
subjects:
  - kind: ServiceAccount
    name: kps-prometheus
    namespace: monitoring
