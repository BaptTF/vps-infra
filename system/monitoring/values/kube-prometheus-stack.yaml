# kube-prometheus-stack. Prometheus is pinned to Contabo because its PVC is
# local-path and must not land on Hetzner. Alertmanager has no volume, so the
# scheduler places it. Grafana is off: agents query Prometheus and Loki directly.

prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

prometheus:
  serviceAccount:
    create: true
    name: kps-prometheus
  prometheusSpec:
    retention: 30d
    retentionSize: 18GB
    scrapeInterval: 30s
    # Pinned to Contabo only because the PVC is local-path and must not land on
    # Hetzner (disk ~79%). Off-cluster targets go through the Tailscale egress
    # Services in tailscale-egress.yaml, not the host network.
    nodeSelector:
      kubernetes.io/hostname: vmi2735515.contaboserver.net
    secrets:
      - monitoring-scrape-auth
    # ServiceMonitors from any namespace must not read files (mounted tokens).
    arbitraryFSAccessThroughSMs:
      deny: true
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    additionalScrapeConfigs:
      - job_name: homeassistant
        scrape_interval: 60s
        metrics_path: /api/prometheus
        scheme: http
        bearer_token_file: /etc/prometheus/secrets/monitoring-scrape-auth/HA_TOKEN
        static_configs:
          - targets: ["ha-home.monitoring.svc.cluster.local:8123"]
            labels:
              instance: homeassistant
              env: home
      - job_name: homeassistant-livebox
        scrape_interval: 60s
        metrics_path: /api/prometheus
        scheme: http
        bearer_token_file: /etc/prometheus/secrets/monitoring-scrape-auth/HA_CAM_TOKEN
        static_configs:
          - targets: ["ha-cam.monitoring.svc.cluster.local:8123"]
            labels:
              instance: homeassistant-livebox
              env: cam
      - job_name: homeassistant-eyg
        scrape_interval: 120s
        scrape_timeout: 30s
        metrics_path: /api/prometheus
        scheme: http
        bearer_token_file: /etc/prometheus/secrets/monitoring-scrape-auth/HA_EYG_TOKEN
        static_configs:
          - targets: ["ha-eyg.monitoring.svc.cluster.local:8123"]
            labels:
              instance: homeassistant-eyg
              env: eyg
      - job_name: snmp-dsplay
        scrape_interval: 60s
        scrape_timeout: 30s
        metrics_path: /snmp
        params:
          module: [synology]
          auth: [syno_v2]
        static_configs:
          - targets: ["nas-snmp.monitoring.svc.cluster.local"]
            labels:
              instance: dsplay
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - target_label: __address__
            replacement: snmp-exporter.monitoring.svc.cluster.local:9116
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

grafana:
  enabled: false

alertmanager:
  enabled: true
  config:
    # Chart defaults, except InfoInhibitor must not swallow node pressure.
    # kube-prometheus-stack 92.17.0 labels that pressure severity info, and
    # InfoInhibitor inhibits every info alert in the namespace while it fires.
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
          - 'alertname !~ "^(KubeNodePressure|KubeNodeEviction|NodeCPUHighUsage|KubeletTooManyPods)$"'
        equal:
          - 'namespace'
      - target_matchers:
          - 'alertname = InfoInhibitor'
    route:
      receiver: sre
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Home Assistant is outside the cluster. Only these scrape jobs, and
        # only the two public IngressRoutes. Other TargetDown and Traefik
        # alerts stay on sre.
        # Traefik v3.7 legacy names (SafeNaming is false) are
        # <namespace>-<ingressroute>-<first 10 bytes of sha256(rule), 20 hex>@kubernetescrd.
        # Today: ha-ha-0e0a439645364101a701 and
        # ha-eyg-ha-eyg-a8da915850a92053f0a8. The regex follows the
        # IngressRoute identity, so a Host() edit does not re-page the agent.
        # The livebox instance has no IngressRoute.
        # These routes are not actionable by the SRE agent. Discord gets them,
        # repeated every 4h, same as the webhook. Watchdog goes to Healthchecks
        # below. InfoInhibitor stays on null.
        - receiver: discord
          repeat_interval: 4h
          matchers:
            - alertname = "HomeAssistantDown"
        - receiver: discord
          repeat_interval: 4h
          matchers:
            - alertname = "TargetDown"
            - job =~ "^(homeassistant|homeassistant-livebox|homeassistant-eyg)$"
        - receiver: discord
          repeat_interval: 4h
          matchers:
            - alertname =~ "^(TraefikService5xx|TraefikHighLatencyP95)$"
            - exported_service =~ "^(ha-ha|ha-eyg-ha-eyg)-[0-9a-f]{20}@kubernetescrd$"
        # local-path does not enforce the PVC request. LocalPathPVCGrowingFast
        # stays on sre. ScanErrors and ScanSlow stay too: the counters are one
        # series per node and have no persistentvolumeclaim label, so they
        # cannot be limited to immich-library without also dropping a real
        # I/O error on another volume.
        - receiver: discord
          repeat_interval: 4h
          matchers:
            - alertname = "LocalPathPVCOverRequested"
        # kube-prometheus-stack 92.17.0 ships node pressure and saturation at
        # severity info. Those stay on sre. The rest of info is noise,
        # including CPUThrottlingHigh, KubeQuotaAlmostFull and KubeQuotaFullyUsed.
        - receiver: discord
          repeat_interval: 4h
          matchers:
            - severity = "info"
            - alertname !~ "^(KubeNodePressure|KubeNodeEviction|NodeCPUHighUsage|KubeletTooManyPods)$"
        # Watchdog is always firing. Ping Healthchecks.io every minute as a
        # dead man's switch (period 1m, grace 10m on the check). continue
        # false so it never falls through to sre. InfoInhibitor stays on null.
        - receiver: watchdog-hc
          continue: false
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
    receivers:
      - name: "null"
      # ALERTMANAGER_DISCORD_WEBHOOK_URL and ALERTMANAGER_HEALTHCHECKS_PING_URL
      # are keys of Secret alertmanager-webhook, synced from Infisical
      # infrastructure/prod path /monitoring/alertmanager.
      # alertmanagerSpec.secrets already mounts that Secret.
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-webhook/ALERTMANAGER_DISCORD_WEBHOOK_URL
            send_resolved: true
      - name: watchdog-hc
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-webhook/ALERTMANAGER_HEALTHCHECKS_PING_URL
            send_resolved: false
      - name: sre
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-webhook/ALERTMANAGER_WEBHOOK_URL
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/alertmanager-webhook/ALERTMANAGER_WEBHOOK_KEY
  alertmanagerSpec:
    secrets:
      - alertmanager-webhook
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi

defaultRules:
  create: true
  # Two small nodes: requests exceed (total - largest node) by design.
  disabled:
    KubeMemoryOvercommit: true
    # kubelet reports the node filesystem for local-path PVCs.
    # Replaced in local-path-exporter.yaml (local-path) and prometheusrules.yaml (other classes).
    KubePersistentVolumeFillingUp: true
    KubePersistentVolumeInodesFillingUp: true

prometheus-node-exporter:
  service:
    listenOnAllInterfaces: false
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 48Mi

# k3s does not run these as scrapeable pods.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

kubelet:
  enabled: true
kubeApiServer:
  enabled: true
