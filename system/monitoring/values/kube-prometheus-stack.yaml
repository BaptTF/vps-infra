# kube-prometheus-stack. Prometheus is pinned to Contabo because its PVC is
# local-path and must not land on Hetzner. Grafana and Alertmanager have no
# volume, so the scheduler places them.

prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

prometheus:
  serviceAccount:
    create: true
    name: kps-prometheus
  prometheusSpec:
    retention: 30d
    retentionSize: 18GB
    scrapeInterval: 30s
    # Pinned to Contabo only because the PVC is local-path and must not land on
    # Hetzner (disk ~79%). Off-cluster targets go through the Tailscale egress
    # Services in tailscale-egress.yaml, not the host network.
    nodeSelector:
      kubernetes.io/hostname: vmi2735515.contaboserver.net
    secrets:
      - monitoring-scrape-auth
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    additionalScrapeConfigs:
      - job_name: homeassistant
        scrape_interval: 60s
        metrics_path: /api/prometheus
        scheme: http
        bearer_token_file: /etc/prometheus/secrets/monitoring-scrape-auth/HA_TOKEN
        static_configs:
          - targets: ["ha-home.monitoring.svc.cluster.local:8123"]
            labels:
              instance: homeassistant
              env: home
      - job_name: homeassistant-cam
        scrape_interval: 60s
        metrics_path: /api/prometheus
        scheme: http
        bearer_token_file: /etc/prometheus/secrets/monitoring-scrape-auth/HA_CAM_TOKEN
        static_configs:
          - targets: ["ha-cam.monitoring.svc.cluster.local:8123"]
            labels:
              instance: homeassistant-cam
              env: cam
      - job_name: homeassistant-eyg
        scrape_interval: 120s
        scrape_timeout: 30s
        metrics_path: /api/prometheus
        scheme: http
        bearer_token_file: /etc/prometheus/secrets/monitoring-scrape-auth/HA_EYG_TOKEN
        static_configs:
          - targets: ["ha-eyg.monitoring.svc.cluster.local:8123"]
            labels:
              instance: homeassistant-eyg
              env: eyg
      - job_name: snmp-dsplay
        scrape_interval: 60s
        scrape_timeout: 30s
        metrics_path: /snmp
        params:
          module: [synology]
          auth: [syno_v2]
        static_configs:
          - targets: ["nas-snmp.monitoring.svc.cluster.local"]
            labels:
              instance: dsplay
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - target_label: __address__
            replacement: snmp-exporter.monitoring.svc.cluster.local:9116
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

grafana:
  enabled: true
  testFramework:
    enabled: false
  persistence:
    enabled: false
  admin:
    existingSecret: "grafana-auth"
    userKey: "admin-user"
    passwordKey: "admin-password"
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 100Mi
    limits:
      memory: 256Mi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi

alertmanager:
  enabled: true
  config:
    route:
      receiver: sre
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog is always firing. InfoInhibitor is a synthetic rule.
        # Neither is an incident, so they must not wake the SRE agent.
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: sre
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/monitoring-scrape-auth/ALERTMANAGER_WEBHOOK_URL
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/monitoring-scrape-auth/ALERTMANAGER_WEBHOOK_KEY
  alertmanagerSpec:
    secrets:
      - monitoring-scrape-auth
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi

defaultRules:
  create: true
  # Two small nodes: requests exceed (total - largest node) by design.
  disabled:
    KubeMemoryOvercommit: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 48Mi

# k3s does not run these as scrapeable pods.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

kubelet:
  enabled: true
kubeApiServer:
  enabled: true
