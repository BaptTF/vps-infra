apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    tailscale.com/tags: tag:monitoring
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - grafana
  defaultBackend:
    service:
      name: kps-grafana
      port:
        number: 80
