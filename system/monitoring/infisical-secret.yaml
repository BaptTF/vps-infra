# Two InfisicalSecrets so each Secret only holds its own keys:
#   /monitoring/grafana -> grafana-auth            (Grafana only)
#   /monitoring/scrape  -> monitoring-scrape-auth  (Prometheus, Alertmanager, snmp-exporter)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # Ensure secrets exist before Helm charts deploy
spec:
  hostAPI: https://app.infisical.com/api
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: infrastructure
        envSlug: prod
        secretsPath: /monitoring/grafana
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: grafana-auth
      secretNamespace: monitoring
      secretType: Opaque
      creationPolicy: Owner
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: monitoring-scrape-auth
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: https://app.infisical.com/api
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: infrastructure
        envSlug: prod
        secretsPath: /monitoring/scrape
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: monitoring-scrape-auth
      secretNamespace: monitoring
      secretType: Opaque
      creationPolicy: Owner
