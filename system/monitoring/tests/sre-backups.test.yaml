# Run from system/monitoring:
#   yq '.spec' prometheusrules-sre.yaml > /tmp/sre-rules.yaml
#   promtool test rules tests/sre-backups.test.yaml
rule_files:
  - /tmp/sre-rules.yaml

evaluation_interval: 1m

tests:
  # Immich never backed up (0) while postgres-cluster is fresh: only Immich fires.
  - interval: 5m
    input_series:
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="cnpg-system", pod="immich-postgres-1"}'
        values: '0x3000'
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="cnpg-system", pod="postgres-cluster-1"}'
        values: '0+300x3000'
      - series: 'cnpg_collector_up{namespace="cnpg-system", pod="immich-postgres-1", cluster="immich-postgres"}'
        values: '1x3000'
      - series: 'cnpg_collector_up{namespace="cnpg-system", pod="postgres-cluster-1", cluster="postgres-cluster"}'
        values: '1x3000'
    alert_rule_test:
      - eval_time: 9d
        alertname: CnpgBackupTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cnpg-system
              cluster: immich-postgres
            exp_annotations:
              summary: "No recent base backup for immich-postgres"
              description: "Last successful base backup is 9d 0h 0m 0s old; the schedule is weekly."
      - eval_time: 9d
        alertname: CnpgBackupMetricsMissing
        exp_alerts: []

  # A failure on one cluster is not hidden by the other cluster's success.
  - interval: 1m
    input_series:
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="cnpg-system", pod="immich-postgres-1"}'
        values: '100x60'
      - series: 'barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="cnpg-system", pod="immich-postgres-1"}'
        values: '200x60'
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="cnpg-system", pod="postgres-cluster-1"}'
        values: '300x60'
      - series: 'barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="cnpg-system", pod="postgres-cluster-1"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: CnpgBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cnpg-system
              cluster: immich-postgres
            exp_annotations:
              summary: "Last base backup of immich-postgres failed"
              description: "The most recent backup attempt failed after the last successful one."

  # Plugin metrics vanish for one cluster.
  - interval: 5m
    input_series:
      - series: 'cnpg_collector_up{namespace="cnpg-system", pod="immich-postgres-1", cluster="immich-postgres"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 40m
        alertname: CnpgBackupMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cnpg-system
              cluster: immich-postgres
            exp_annotations:
              summary: "No Barman Cloud metrics for immich-postgres"
              description: "The cluster is scraped but the plugin reports nothing; backup alerts cannot fire."

  # Exporter target down after it had been working.
  - interval: 5m
    input_series:
      - series: 'up{job="cloudflare-exporter", namespace="monitoring"}'
        values: '1 1 0x10'
    alert_rule_test:
      - eval_time: 50m
        alertname: CloudflareExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "cloudflare-exporter is down"
              description: "No healthy scrape for 30 minutes; the R2 size alert is running on stale data."

  # Daily k8up backup completed 2h ago: under the 36h threshold.
  - interval: 5m
    input_series:
      - series: 'kube_job_status_completion_time{namespace="vikunja", job_name="backup-pvc-backup-backup-aaa-0"}'
        values: '0x50'
      - series: 'kube_job_status_succeeded{namespace="vikunja", job_name="backup-pvc-backup-backup-aaa-0"}'
        values: '1x50'
      - series: 'kube_job_owner{namespace="vikunja", job_name="backup-pvc-backup-backup-aaa-0", owner_kind="Backup", owner_name="pvc-backup-backup-aaa", owner_is_controller="true"}'
        values: '1x50'
    alert_rule_test:
      - eval_time: 2h
        alertname: K8upBackupTooOld
        exp_alerts: []

  # Daily k8up backup last succeeded 40h ago: fires after the 1h pending window.
  - interval: 5m
    input_series:
      - series: 'kube_job_status_completion_time{namespace="vikunja", job_name="backup-pvc-backup-backup-aaa-0"}'
        values: '0x500'
      - series: 'kube_job_status_succeeded{namespace="vikunja", job_name="backup-pvc-backup-backup-aaa-0"}'
        values: '1x500'
      - series: 'kube_job_owner{namespace="vikunja", job_name="backup-pvc-backup-backup-aaa-0", owner_kind="Backup", owner_name="pvc-backup-backup-aaa", owner_is_controller="true"}'
        values: '1x500'
    alert_rule_test:
      - eval_time: 40h
        alertname: K8upBackupTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: vikunja
              schedule: pvc-backup
              period: daily
            exp_annotations:
              summary: "No recent k8up backup for vikunja/pvc-backup"
              description: "Last successful backup is 1d 16h 0m 0s old; the schedule is daily (threshold 36h)."

  # Weekly archives last succeeded 16d ago, but a Job has been running 33h: suppressed.
  - interval: 5m
    input_series:
      - series: 'kube_job_status_completion_time{namespace="immich", job_name="backup-archives-backup-backup-old-0"}'
        values: '0x4700'
      - series: 'kube_job_status_succeeded{namespace="immich", job_name="backup-archives-backup-backup-old-0"}'
        values: '1x4700'
      - series: 'kube_job_owner{namespace="immich", job_name="backup-archives-backup-backup-old-0", owner_kind="Backup", owner_name="archives-backup-backup-old", owner_is_controller="true"}'
        values: '1x4700'
      - series: 'kube_job_status_start_time{namespace="immich", job_name="backup-archives-backup-backup-run-0"}'
        values: '1263600x4700'
      - series: 'kube_job_status_active{namespace="immich", job_name="backup-archives-backup-backup-run-0"}'
        values: '1x4700'
      - series: 'kube_job_owner{namespace="immich", job_name="backup-archives-backup-backup-run-0", owner_kind="Backup", owner_name="archives-backup-backup-run", owner_is_controller="true"}'
        values: '1x4700'
    alert_rule_test:
      - eval_time: 16d
        alertname: K8upBackupTooOld
        exp_alerts: []

  # Weekly storagebox last succeeded 9d ago, no Job running: fires.
  - interval: 5m
    input_series:
      - series: 'kube_job_status_completion_time{namespace="immich", job_name="backup-storagebox-backup-backup-old-0"}'
        values: '0x2700'
      - series: 'kube_job_status_succeeded{namespace="immich", job_name="backup-storagebox-backup-backup-old-0"}'
        values: '1x2700'
      - series: 'kube_job_owner{namespace="immich", job_name="backup-storagebox-backup-backup-old-0", owner_kind="Backup", owner_name="storagebox-backup-backup-old", owner_is_controller="true"}'
        values: '1x2700'
    alert_rule_test:
      - eval_time: 9d
        alertname: K8upBackupTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: immich
              schedule: storagebox-backup
              period: weekly
            exp_annotations:
              summary: "No recent k8up backup for immich/storagebox-backup"
              description: "Last successful backup is 9d 0h 0m 0s old; the schedule is weekly (threshold 8d)."

  # Weekly storagebox last succeeded 5d ago: under the 8d threshold.
  - interval: 5m
    input_series:
      - series: 'kube_job_status_completion_time{namespace="immich", job_name="backup-storagebox-backup-backup-ok-0"}'
        values: '0x1500'
      - series: 'kube_job_status_succeeded{namespace="immich", job_name="backup-storagebox-backup-backup-ok-0"}'
        values: '1x1500'
      - series: 'kube_job_owner{namespace="immich", job_name="backup-storagebox-backup-backup-ok-0", owner_kind="Backup", owner_name="storagebox-backup-backup-ok", owner_is_controller="true"}'
        values: '1x1500'
    alert_rule_test:
      - eval_time: 5d
        alertname: K8upBackupTooOld
        exp_alerts: []

  # No k8up failure in 24h.
  - interval: 5m
    input_series:
      - series: 'k8up_jobs_failed_counter{jobType="backup", exported_namespace="gowa", namespace="k8up"}'
        values: '0x360'
    alert_rule_test:
      - eval_time: 25h
        alertname: K8upBackupFailedRecently
        exp_alerts: []

  # A failure increment is visible in the last 24h.
  - interval: 5m
    input_series:
      - series: 'k8up_jobs_failed_counter{jobType="backup", exported_namespace="gowa", namespace="k8up"}'
        values: '0x120 1x240'
    alert_rule_test:
      - eval_time: 25h
        alertname: K8upBackupFailedRecently
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: gowa
            exp_annotations:
              summary: "k8up backup failed in gowa"
              description: "1 k8up backup job(s) failed in the last 24 hours."
