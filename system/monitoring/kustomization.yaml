apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - infisical-secret.yaml
  - grafana-tailscale-ingress.yaml
  - tailscale-ingress.yaml
  - tailscale-egress.yaml
  - grafana-datasource-loki.yaml
  - prometheusrules.yaml
  - servicemonitors.yaml
  - snmp-exporter.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    releaseName: kps
    version: 92.10.1
    valuesFile: values/kube-prometheus-stack.yaml
    namespace: monitoring
    includeCRDs: true
  - name: loki
    repo: https://grafana.github.io/helm-charts
    releaseName: loki
    version: 7.5.0
    valuesFile: values/loki.yaml
    namespace: monitoring
  - name: alloy
    repo: https://grafana.github.io/helm-charts
    releaseName: alloy
    version: 1.14.2
    valuesFile: values/alloy.yaml
    namespace: monitoring

# Never prune the Prometheus Operator CRDs: deleting them would cascade to every
# ServiceMonitor, PodMonitor and PrometheusRule in the cluster.
patches:
  - target:
      kind: CustomResourceDefinition
      name: ".*\\.monitoring\\.coreos\\.com"
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Prune=false,ServerSideApply=true
