# Synology MIBs the NAS already loads. The community string is injected at
# start from Infisical and is not stored in this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-modules
  namespace: monitoring
data:
  modules.yml: |
    modules:
      synology:
        walk:
          - 1.3.6.1.2.1.1.3
          - 1.3.6.1.2.1.25.2.3.1
          - 1.3.6.1.4.1.6574.1.1
          - 1.3.6.1.4.1.6574.1.2
          - 1.3.6.1.4.1.6574.1.4
          - 1.3.6.1.4.1.6574.2.1.1
          - 1.3.6.1.4.1.6574.3.1.1
        metrics:
          - name: sysUpTime
            oid: 1.3.6.1.2.1.1.3
            type: gauge
            help: System uptime in ticks
          - name: synologySystemStatus
            oid: 1.3.6.1.4.1.6574.1.1
            type: gauge
            help: Synology system status (1 normal)
          - name: synologyTemperatureCelsius
            oid: 1.3.6.1.4.1.6574.1.2
            type: gauge
            help: Synology system temperature
          - name: synologySystemFanStatus
            oid: 1.3.6.1.4.1.6574.1.4.1
            type: gauge
            help: Synology system fan status (1 normal)
          - name: hrStorageSize
            oid: 1.3.6.1.2.1.25.2.3.1.5
            type: gauge
            help: Storage size in allocation units
            indexes:
              - labelname: hrStorageIndex
                type: gauge
            lookups:
              - labels: [hrStorageIndex]
                labelname: hrStorageDescr
                oid: 1.3.6.1.2.1.25.2.3.1.3
                type: DisplayString
          - name: hrStorageUsed
            oid: 1.3.6.1.2.1.25.2.3.1.6
            type: gauge
            help: Storage used in allocation units
            indexes:
              - labelname: hrStorageIndex
                type: gauge
            lookups:
              - labels: [hrStorageIndex]
                labelname: hrStorageDescr
                oid: 1.3.6.1.2.1.25.2.3.1.3
                type: DisplayString
          - name: hrStorageAllocationUnits
            oid: 1.3.6.1.2.1.25.2.3.1.4
            type: gauge
            help: Bytes per allocation unit
            indexes:
              - labelname: hrStorageIndex
                type: gauge
          - name: synologyDiskStatus
            oid: 1.3.6.1.4.1.6574.2.1.1.5
            type: gauge
            help: Disk status (1 normal, 2 initialized, 3 not initialized, 4 system partition failed, 5 crashed)
            indexes:
              - labelname: synoDiskIndex
                type: gauge
            lookups:
              - labels: [synoDiskIndex]
                labelname: synoDiskID
                oid: 1.3.6.1.4.1.6574.2.1.1.2
                type: DisplayString
          - name: synologyDiskTemperatureCelsius
            oid: 1.3.6.1.4.1.6574.2.1.1.6
            type: gauge
            help: Disk temperature
            indexes:
              - labelname: synoDiskIndex
                type: gauge
            lookups:
              - labels: [synoDiskIndex]
                labelname: synoDiskID
                oid: 1.3.6.1.4.1.6574.2.1.1.2
                type: DisplayString
          - name: synologyRaidStatus
            oid: 1.3.6.1.4.1.6574.3.1.1.3
            type: gauge
            help: RAID status (1 normal, 2 repairing, 3 migrating, 4 expanding, 5 deleting, 6 creating, 7 raidSyncing, 8 raidParityChecking, 9 raidAssembling, 10 canceling, 11 degraded, 12 crashed)
            indexes:
              - labelname: synoRaidIndex
                type: gauge
            lookups:
              - labels: [synoRaidIndex]
                labelname: synoRaidName
                oid: 1.3.6.1.4.1.6574.3.1.1.2
                type: DisplayString
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
  namespace: monitoring
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snmp-exporter
  template:
    metadata:
      labels:
        app: snmp-exporter
    spec:
      # The NAS is reached through the nas-snmp Tailscale egress Service.
      initContainers:
        - name: render-config
          image: busybox:1.38.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              community="invalid"
              if [ -s /auth/SNMP_COMMUNITY ]; then
                community=$(cat /auth/SNMP_COMMUNITY)
                case "$community" in
                  *\"*|*\\*|*" "*)
                    echo "SNMP_COMMUNITY contains a character the config writer rejects" >&2
                    exit 1
                    ;;
                esac
              else
                echo "SNMP_COMMUNITY is missing; dsplay scrapes will fail until it is set in Infisical /monitoring" >&2
              fi
              cat > /etc/snmp_exporter/snmp.yml << EOF
              auths:
                syno_v2:
                  version: 2
                  community: ${community}
                  security_level: noAuthNoPriv
              EOF
              cat /modules/modules.yml >> /etc/snmp_exporter/snmp.yml
          volumeMounts:
            - name: modules
              mountPath: /modules
              readOnly: true
            - name: auth
              mountPath: /auth
              readOnly: true
            - name: config
              mountPath: /etc/snmp_exporter
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
      containers:
        - name: snmp-exporter
          image: prom/snmp-exporter:v0.30.1
          args:
            - --config.file=/etc/snmp_exporter/snmp.yml
          ports:
            - name: http
              containerPort: 9116
          volumeMounts:
            - name: config
              mountPath: /etc/snmp_exporter
              readOnly: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi
      volumes:
        - name: modules
          configMap:
            name: snmp-exporter-modules
        - name: auth
          secret:
            secretName: monitoring-scrape-auth
            optional: true
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: snmp-exporter
  namespace: monitoring
  labels:
    app: snmp-exporter
spec:
  selector:
    app: snmp-exporter
  ports:
    - name: http
      port: 9116
      targetPort: http
