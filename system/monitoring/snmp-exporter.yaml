# The snmp_exporter modules live in snmp-exporter-modules.yml and are turned into
# the snmp-exporter-modules ConfigMap by the configMapGenerator in
# kustomization.yaml. The generator appends a content hash to the ConfigMap name
# and rewrites the reference below, so any change to the modules rolls the pod
# (the initContainer only renders the config at start).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
  namespace: monitoring
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snmp-exporter
  template:
    metadata:
      labels:
        app: snmp-exporter
    spec:
      # The NAS is reached through the nas-snmp Tailscale egress Service.
      initContainers:
        - name: render-config
          image: busybox:1.38.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              community="invalid"
              if [ -s /auth/SNMP_COMMUNITY ]; then
                community=$(cat /auth/SNMP_COMMUNITY)
                # Also reject CR/LF: they would break the generated YAML.
                crlf="$(printf '\r\n_')"; crlf="${crlf%_}"
                case "$community" in
                  *\"*|*\\*|*" "*|*"'"*|*["$crlf"]*)
                    echo "SNMP_COMMUNITY contains a character the config writer rejects" >&2
                    exit 1
                    ;;
                esac
              else
                echo "SNMP_COMMUNITY is missing; dsplay scrapes will fail until it is set in Infisical /monitoring/scrape" >&2
              fi
              cat > /etc/snmp_exporter/snmp.yml << EOF
              auths:
                syno_v2:
                  version: 2
                  community: '${community}'
                  security_level: noAuthNoPriv
              EOF
              cat /modules/modules.yml >> /etc/snmp_exporter/snmp.yml
          volumeMounts:
            - name: modules
              mountPath: /modules
              readOnly: true
            - name: auth
              mountPath: /auth
              readOnly: true
            - name: config
              mountPath: /etc/snmp_exporter
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
      containers:
        - name: snmp-exporter
          image: prom/snmp-exporter:v0.30.1
          args:
            - --config.file=/etc/snmp_exporter/snmp.yml
          ports:
            - name: http
              containerPort: 9116
          volumeMounts:
            - name: config
              mountPath: /etc/snmp_exporter
              readOnly: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi
      volumes:
        - name: modules
          configMap:
            name: snmp-exporter-modules
        - name: auth
          secret:
            secretName: monitoring-scrape-auth
            optional: true
            items:
              - key: SNMP_COMMUNITY
                path: SNMP_COMMUNITY
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: snmp-exporter
  namespace: monitoring
  labels:
    app: snmp-exporter
spec:
  selector:
    app: snmp-exporter
  ports:
    - name: http
      port: 9116
      targetPort: http
