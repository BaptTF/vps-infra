apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-apps
  namespace: monitoring
spec:
  groups:
    - name: cluster-apps
      rules:
        - alert: CnpgPodNotReady
          expr: |
            kube_pod_status_ready{namespace="cnpg-system", condition="true", pod=~"(postgres-cluster|immich-postgres)-[0-9]+"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CNPG pod {{ $labels.pod }} is not ready"
        - alert: CnpgClusterNoReadyPod
          # Only when no instance pod exists at all. A pod that exists but is not
          # ready is already covered by CnpgPodNotReady (instances: 1).
          expr: |
            label_replace(absent(kube_pod_status_ready{namespace="cnpg-system", condition="true", pod=~"postgres-cluster-[0-9]+"}), "cluster", "postgres-cluster", "", "")
            or
            label_replace(absent(kube_pod_status_ready{namespace="cnpg-system", condition="true", pod=~"immich-postgres-[0-9]+"}), "cluster", "immich-postgres", "", "")
          for: 5m
          labels:
            severity: critical
            namespace: cnpg-system
          annotations:
            summary: "CNPG cluster {{ $labels.cluster }} has no instance pod"
        - alert: ArgoCDAppNotHealthy
          expr: |
            argocd_app_info{health_status=~"Degraded|Missing"} == 1
            or argocd_app_info{sync_status="OutOfSync"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application {{ $labels.name }} is {{ $labels.health_status }} / {{ $labels.sync_status }}"
        - alert: TraefikService5xx
          expr: |
            (
              sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
              /
              sum by (service) (rate(traefik_service_requests_total[5m]))
            ) > 0.05
            and
            sum by (service) (rate(traefik_service_requests_total[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Traefik service {{ $labels.service }} is returning 5xx"
