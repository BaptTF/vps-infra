apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-apps
  namespace: monitoring
spec:
  groups:
    - name: cluster-apps
      rules:
        - alert: CnpgPodNotReady
          expr: |
            kube_pod_status_ready{namespace="cnpg-system", condition="true", pod=~"(postgres-cluster|immich-postgres)-[0-9]+"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CNPG pod {{ $labels.pod }} is not ready"
        - alert: CnpgClusterNoReadyPod
          # Only when no instance pod exists at all. A pod that exists but is not
          # ready is already covered by CnpgPodNotReady (instances: 1).
          expr: |
            label_replace(absent(kube_pod_status_ready{namespace="cnpg-system", condition="true", pod=~"postgres-cluster-[0-9]+"}), "cluster", "postgres-cluster", "", "")
            or
            label_replace(absent(kube_pod_status_ready{namespace="cnpg-system", condition="true", pod=~"immich-postgres-[0-9]+"}), "cluster", "immich-postgres", "", "")
          for: 5m
          labels:
            severity: critical
            namespace: cnpg-system
          annotations:
            summary: "CNPG cluster {{ $labels.cluster }} has no instance pod"
        - alert: ArgoCDAppNotHealthy
          expr: |
            argocd_app_info{health_status=~"Degraded|Missing"} == 1
            or argocd_app_info{sync_status="OutOfSync"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application {{ $labels.name }} is {{ $labels.health_status }} / {{ $labels.sync_status }}"
        - alert: TraefikService5xx
          expr: |
            (
              sum by (exported_service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
              /
              sum by (exported_service) (rate(traefik_service_requests_total[5m]))
            ) > 0.05
            and
            sum by (exported_service) (rate(traefik_service_requests_total[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Traefik service {{ $labels.exported_service }} is returning 5xx"
    # Replaces the kps defaults, disabled because kubelet reports the node
    # filesystem for local-path PVCs (covered by local-path-exporter.yaml).
    - name: pvc-non-local-path
      rules:
        - alert: KubePersistentVolumeFillingUp
          expr: |
            (
              kubelet_volume_stats_available_bytes{job="kubelet", metrics_path="/metrics"}
              /
              kubelet_volume_stats_capacity_bytes{job="kubelet", metrics_path="/metrics"}
            ) < 0.10
            unless on (namespace, persistentvolumeclaim)
            kube_persistentvolumeclaim_info{storageclass="local-path"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} free"
        - alert: KubePersistentVolumeInodesFillingUp
          expr: |
            (
              kubelet_volume_stats_inodes_free{job="kubelet", metrics_path="/metrics"}
              /
              kubelet_volume_stats_inodes{job="kubelet", metrics_path="/metrics"}
            ) < 0.10
            and
            kubelet_volume_stats_inodes{job="kubelet", metrics_path="/metrics"} > 0
            unless on (namespace, persistentvolumeclaim)
            kube_persistentvolumeclaim_info{storageclass="local-path"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} free inodes"
        - alert: ArchiveIndexWalkStalled
          expr: |
            archive_index_walk_running == 1
            and increase(archive_index_files_hashed_total[2h]) == 0
            and increase(archive_index_files_skipped_total[2h]) == 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "archive-index walk is running but hashing nothing"
        - alert: ArchiveIndexHashErrors
          expr: |
            increase(archive_index_hash_errors_total[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "archive-index is failing to hash files"
    # Replaces the kube-prometheus-stack defaults, disabled below. k8up Jobs are
    # excluded: weekly archives/storagebox backups regularly run past the 12h
    # KubeJobNotCompleted window, and failed Jobs are garbage-collected by
    # failedJobsHistoryLimit: 0. Coverage is K8upBackupTooOld / K8upBackupFailedRecently.
    - name: kubernetes-apps-jobs
      rules:
        - alert: KubeJobNotCompleted
          expr: |
            time() - max by (namespace, job_name, cluster) (
              kube_job_status_start_time{job="kube-state-metrics", namespace=~".*"}
              and
              kube_job_status_active{job="kube-state-metrics", namespace=~".*"} > 0
            ) > 43200
            unless on (namespace, job_name)
              kube_job_owner{owner_kind="Backup"}
          labels:
            severity: warning
          annotations:
            summary: "Job did not complete in time"
            description: "Job {{ $labels.namespace }}/{{ $labels.job_name }} is taking more than 12h to complete."
        - alert: KubeJobFailed
          expr: |
            kube_job_failed{job="kube-state-metrics", namespace=~".*"} > 0
            unless on (namespace, job_name)
              kube_job_owner{owner_kind="Backup"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Job failed to complete."
            description: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed to complete. Removing the failed job after investigation should clear this alert."

