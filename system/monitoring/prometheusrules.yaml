apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-apps
  namespace: monitoring
spec:
  groups:
    - name: cluster-apps
      rules:
        - alert: CnpgPodNotReady
          expr: |
            kube_pod_status_ready{namespace="cnpg-system", condition="true", pod=~"postgres-cluster-.+|immich-postgres-.+"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CNPG pod {{ $labels.pod }} is not ready"
        - alert: ArgoCDAppNotHealthy
          expr: |
            argocd_app_info{health_status=~"Degraded|Missing"} == 1
            or argocd_app_info{sync_status="OutOfSync"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application {{ $labels.name }} is {{ $labels.health_status }} / {{ $labels.sync_status }}"
        - alert: TraefikService5xx
          expr: |
            sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m])) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Traefik service {{ $labels.service }} is returning 5xx"
