---
apiVersion: v1
kind: Service
metadata:
  name: nas-snmp
  namespace: monitoring
  annotations:
    tailscale.com/tailnet-ip: "100.75.160.28"
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - name: snmp
      port: 161
      protocol: UDP
