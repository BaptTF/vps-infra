apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agents
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
      argocd.argoproj.io/manifest-generate-paths: .
spec:
  project: default
  source:
    repoURL: 'https://github.com/BaptTF/vps-infra.git'
    targetRevision: HEAD
    path: workloads/agents
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openclaw
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: ""
      kind: Service
      name: nas-proxy
      namespace: openclaw
      jsonPointers:
      - /spec/externalName
    - group: ""
      kind: Service
      name: leo-ha
      namespace: openclaw
      jsonPointers:
      - /spec/externalName
    - group: ""
      kind: Service
      name: leo-dsplay
      namespace: openclaw
      jsonPointers:
      - /spec/externalName
    - group: ""
      kind: Service
      name: leo-diskstation
      namespace: openclaw
      jsonPointers:
      - /spec/externalName
