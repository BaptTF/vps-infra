apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: camille-recettes
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  project: default
  source:
    repoURL: 'https://github.com/BaptTF/vps-infra.git'
    targetRevision: HEAD
    path: workloads/camille-recettes
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: camille-recettes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
