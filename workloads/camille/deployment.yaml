# Camille's site at camille.bapttf.com. Content comes from the `site` branch
# of rjullien/camille-potager (rebuilt by GitHub Actions on push to main).
# Later sites on this host are extra PathPrefix routes, not a new hostname.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camille
  namespace: camille
  labels:
    app: camille
spec:
  replicas: 1
  selector:
    matchLabels:
      app: camille
  template:
    metadata:
      labels:
        app: camille
    spec:
      initContainers:
        - name: git-clone
          image: alpine/git:2.54.0
          command: ["/bin/sh", "/scripts/pull.sh"]
          env:
            - name: GIT_PULL_ONCE
              value: "1"
          volumeMounts:
            - name: deploy-key
              mountPath: /deploy-key
              readOnly: true
            - name: www
              mountPath: /www
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: git-pull
          image: alpine/git:2.54.0
          command: ["/bin/sh", "/scripts/pull.sh"]
          volumeMounts:
            - name: deploy-key
              mountPath: /deploy-key
              readOnly: true
            - name: www
              mountPath: /www
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: sws
          image: ghcr.io/static-web-server/static-web-server:2.44.0
          env:
            - name: SERVER_ROOT
              value: /www
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_HOST
              value: 0.0.0.0
            - name: SERVER_HEALTH
              value: "true"
            - name: SERVER_LOG_LEVEL
              value: info
            - name: SERVER_COMPRESSION
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: www
              mountPath: /www
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: deploy-key
          secret:
            secretName: camille-deploy-key
            defaultMode: 0400
            items:
              - key: id_ed25519
                path: id_ed25519
        - name: www
          emptyDir:
            sizeLimit: 1Gi
        - name: scripts
          configMap:
            name: camille-git-pull
            defaultMode: 0555
