# Whole host for now. A later site is another route with PathPrefix on this host.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: camille
  namespace: camille
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`camille.bapttf.com`) && Path(`/metrics`)
      kind: Rule
      priority: 100
      middlewares:
        - name: deny-public-metrics
      services:
        - name: camille
          port: 80
    - match: Host(`camille.bapttf.com`)
      kind: Rule
      middlewares:
        - name: forwardauth-authelia
          namespace: authelia
      services:
        - name: camille
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-public-metrics
  namespace: camille
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
