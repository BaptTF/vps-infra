apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ai-usage-exporter-infisical-secret
  namespace: ai-usage-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: https://app.infisical.com/api
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: infrastructure
        envSlug: prod
        secretsPath: /agents/bifrost/opencode
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: ai-usage-exporter-secret
      secretNamespace: ai-usage-exporter
      secretType: Opaque
      creationPolicy: Owner
---
