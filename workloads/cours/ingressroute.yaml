apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cours
  namespace: cours
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cours.bapttf.com`)
      kind: Rule
      middlewares:
        - name: forwardauth-authelia
          namespace: authelia
      services:
        - name: cours
          port: 9847
  tls:
    secretName: cours-tls-certificate
