apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vikunja
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`task.bapttf.com`) && PathPrefix(`/api/v1/metrics`)
      kind: Rule
      priority: 100
      middlewares:
        - name: deny-public-metrics
      services:
        - name: vikunja
          port: 3456
    - match: Host(`task.bapttf.com`)
      kind: Rule
      services:
        - name: vikunja
          port: 3456
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-public-metrics
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
