apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode-dashboard
  namespace: opencode-dashboard
  labels:
    app: opencode-dashboard
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: opencode-dashboard
  template:
    metadata:
      labels:
        app: opencode-dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencode-dashboard
          image: ghcr.io/rjullien/opencode-usage-tracker:main
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: CACHE_TTL
              value: "30s"
            - name: PROMETHEUS_URL
              value: http://prometheus-longterm.monitoring.svc.cluster.local:9090
            - name: OPENCODE_GO_API_KEY_B
              valueFrom:
                secretKeyRef:
                  name: opencode-dashboard-secret
                  key: OPENCODE_GO_API_KEY_B
            - name: OPENCODE_GO_API_KEY_R
              valueFrom:
                secretKeyRef:
                  name: opencode-dashboard-secret
                  key: OPENCODE_GO_API_KEY_R
            - name: OPENCODE_GO_API_KEY_A
              valueFrom:
                secretKeyRef:
                  name: opencode-dashboard-secret
                  key: OPENCODE_GO_API_KEY_A
            - name: OPENCODE_GO_API_KEY_N
              valueFrom:
                secretKeyRef:
                  name: opencode-dashboard-secret
                  key: OPENCODE_GO_API_KEY_N
            - name: DEVIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-dashboard-secret-devin
                  key: DEVIN_API_KEY
                  optional: true
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-dashboard-secret-cursor
                  key: CURSOR_API_KEY
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "5m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
