apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: opencode-dashboard-infisical-secret
  namespace: opencode-dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: https://app.infisical.com/api
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: infrastructure
        envSlug: prod
        secretsPath: /agents/bifrost
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: opencode-dashboard-secret
      secretNamespace: opencode-dashboard
      secretType: Opaque
      creationPolicy: Owner
