apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  labels:
    app: vaultwarden
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.4
          ports:
            - containerPort: 80
          env:
            - name: DOMAIN
              value: "https://vault.bapttf.com"
            - name: SMTP_HOST
              value: smtp.resend.com
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_SECURITY
              value: starttls
            - name: SMTP_USERNAME
              value: resend
            - name: SMTP_FROM
              value: vaultwarden@bapttf.com
            - name: SMTP_FROM_NAME
              value: Vaultwarden
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resend
                  key: api-key
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
