# Public traffic comes from Traefik; tailnet traffic comes only from this
# dashboard's tagged Tailscale ingress. The only application egress is longterm.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-infra-ingress
  namespace: dashboard-infra
spec:
  podSelector:
    matchLabels:
      app: dashboard-infra
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/parent-resource: dashboard
              tailscale.com/parent-resource-ns: dashboard-infra
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-infra-egress
  namespace: dashboard-infra
spec:
  podSelector:
    matchLabels:
      app: dashboard-infra
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              operator.prometheus.io/name: longterm
      ports:
        - protocol: TCP
          port: 9090
