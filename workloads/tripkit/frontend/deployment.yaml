apiVersion: apps/v1
kind: Deployment
metadata:
  name: tripkit-frontend
  namespace: tripkit
  labels:
    app: tripkit-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tripkit-frontend
  template:
    metadata:
      labels:
        app: tripkit-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-login-secret
      initContainers:
        - name: render-config
          image: ghcr.io/rjullien/tripkit-frontend
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "envsubst '${API_URL} ${API_PREFIX}' < /etc/nginx/templates/config.js.template > /config/config.js"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: API_URL
              value: "https://tripkit.bapttf.com"
            - name: API_PREFIX
              value: "/api"
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: 8Mi
              cpu: 5m
            limits:
              memory: 32Mi
      containers:
        - name: frontend
          image: ghcr.io/rjullien/tripkit-frontend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: API_URL
              value: "https://tripkit.bapttf.com"
            - name: API_PREFIX
              value: "/api"
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
            - name: run
              mountPath: /run
            - name: nginx-cache
              mountPath: /var/cache/nginx
          resources:
            requests:
              memory: 16Mi
              cpu: 5m
            limits:
              memory: 64Mi
              cpu: 100m
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 30
      volumes:
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
