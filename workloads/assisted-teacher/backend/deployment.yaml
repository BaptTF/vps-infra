apiVersion: apps/v1
kind: Deployment
metadata:
  name: assisted-teacher-backend
  namespace: assisted-teacher
  labels:
    app: assisted-teacher-backend
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: assisted-teacher-backend
  template:
    metadata:
      labels:
        app: assisted-teacher-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: data-ownership
          image: busybox:1.38.0
          command: ["sh", "-c", "find /workspace -xdev ! -user 65532 -exec chown 65532:65532 {} +"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 64Mi
      containers:
        - name: backend
          image: ghcr.io/rjullien/assisted-teacher/backend:main
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 9847
              name: http
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
            - name: PORT
              value: "9847"
            - name: WORKSPACE_DIR
              value: "/workspace"
            - name: HERMES_URL
              value: "http://hermes-lya.openclaw.svc.cluster.local:8642"
            - name: HERMES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: assisted-teacher-secret
                  key: API_SERVER_KEY
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: assisted-teacher-workspace
