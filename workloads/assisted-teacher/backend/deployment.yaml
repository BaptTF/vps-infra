apiVersion: apps/v1
kind: Deployment
metadata:
  name: assisted-teacher-backend
  namespace: assisted-teacher
  labels:
    app: assisted-teacher-backend
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: assisted-teacher-backend
  template:
    metadata:
      labels:
        app: assisted-teacher-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/rjullien/assisted-teacher/backend:main
          ports:
            - containerPort: 9847
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "9847"
            - name: WORKSPACE_DIR
              value: "/workspace"
            - name: HERMES_URL
              value: "http://hermes-lya.openclaw.svc.cluster.local:8642"
            - name: HERMES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: assisted-teacher-secret
                  key: API_SERVER_KEY
            # Pi reads Bifrost URL from entrypoint.sh default
            # (bifrost.openclaw.svc.cluster.local:8080/v1, no auth needed)
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: assisted-teacher-workspace
