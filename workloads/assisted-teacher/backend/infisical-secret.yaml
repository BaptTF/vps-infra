apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: assisted-teacher-infisical-secret
  namespace: assisted-teacher
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: https://app.infisical.com/api
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: infrastructure
        envSlug: prod
        secretsPath: /agents/hermes
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: assisted-teacher-secret
      secretNamespace: assisted-teacher
      secretType: Opaque
      creationPolicy: Owner
