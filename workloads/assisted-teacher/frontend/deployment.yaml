apiVersion: apps/v1
kind: Deployment
metadata:
  name: assisted-teacher-frontend
  namespace: assisted-teacher
  labels:
    app: assisted-teacher-frontend
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: assisted-teacher-frontend
  template:
    metadata:
      labels:
        app: assisted-teacher-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/rjullien/assisted-teacher/frontend:main
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 30
          volumeMounts:
            - name: run
              mountPath: /run
            - name: nginx-cache
              mountPath: /var/cache/nginx
          resources:
            requests:
              cpu: "5m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
