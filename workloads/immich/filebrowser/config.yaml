server:
  cacheDir: /home/filebrowser/data/tmp
  database:
    path: /home/filebrowser/data/database.sqlite
    # v1 BoltDB on the filebrowser-data PVC. v2 imports it on first start and
    # leaves the file in place. Remove this key only after that import is
    # verified, and only once database.db can be deleted.
    migrateFrom: /home/filebrowser/data/database.db
  sources:
    - path: /srv/inbox
      config:
        defaultEnabled: true
        defaultPermissions:
          view: true
          download: true
          modify: true
          create: true
          delete: true
    - path: /srv/library
      config:
        defaultEnabled: true
        defaultPermissions:
          view: true
          download: true
          modify: true
          create: true
          delete: true
    - path: /srv/nas
      name: NAS
      config:
        defaultEnabled: true
        defaultPermissions:
          view: true
          download: true
          modify: true
          create: true
          delete: true
        rules:
          - folderPath: "/"
            viewable: true
auth:
  adminUsername: baptiste
  methods:
    proxy:
      enabled: true
      header: "Remote-User"
    password:
      enabled: false
      minLength: 0
userDefaults:
  account:
    loginMethod: proxy
    permissions:
      admin: false
      share: true
      api: false
      realtime: false
http:
  port: 80
  externalUrl: "https://drive.bapttf.com"
  trustProxyHeaders: true
