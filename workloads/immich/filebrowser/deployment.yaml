apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: immich
  labels:
    app: filebrowser
spec:
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-family-dirs
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              # Ownership/mode come from the SMB mount options of the
              # immich-storagebox PV (uid=1000,gid=1000,dir_mode=0775), so a
              # recursive chown/chmod is a no-op that only costs startup time.
              mkdir -p /data/family/inbox /data/family/library
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: storagebox
              mountPath: /data
      containers:
        - name: filebrowser
          image: ghcr.io/gtsteffaniak/filebrowser:2.1.0-stable
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: storagebox
              mountPath: /srv/inbox
              subPath: family/inbox
            - name: storagebox
              mountPath: /srv/library
              subPath: family/library
            - name: nas
              mountPath: /srv/nas
            - name: config
              mountPath: /home/filebrowser/data
            - name: filebrowser-config
              mountPath: /home/filebrowser/data/config.yaml
              subPath: config.yaml
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: storagebox
          persistentVolumeClaim:
            claimName: immich-storagebox
        - name: nas
          persistentVolumeClaim:
            claimName: immich-archives
        - name: config
          persistentVolumeClaim:
            claimName: filebrowser-data
        - name: filebrowser-config
          configMap:
            name: filebrowser-config
