apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: filebrowser
  namespace: immich
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`drive.bapttf.com`)
      kind: Rule
      middlewares:
        - name: forwardauth-authelia
          namespace: authelia
      services:
        - name: filebrowser
          port: 80
  # DNS-only (not proxied by Cloudflare): no origin pull certificate.
  tls:
    options:
      name: direct
      namespace: traefik
