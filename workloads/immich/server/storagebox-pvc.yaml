apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-storagebox
  namespace: immich
  labels:
    backup.bapttf.com/repository: photos
  annotations:
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: immich-storagebox
  volumeName: immich-storagebox
  resources:
    requests:
      storage: 1Ti
