apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
  labels:
    app: immich
    component: server
spec:
  selector:
    app: immich
    component: server
  ports:
    - name: http
      port: 2283
      targetPort: http
    - name: metrics-api
      port: 8081
      targetPort: metrics-api
    - name: metrics-microservices
      port: 8082
      targetPort: metrics-microservices
