apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich
  namespace: immich
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`immich.bapttf.com`)
      kind: Rule
      services:
        - name: immich-server
          port: 2283
  # DNS-only (not proxied by Cloudflare): no origin pull certificate.
  tls:
    options:
      name: direct
      namespace: traefik
