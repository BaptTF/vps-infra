apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-archives
  namespace: immich
  labels:
    backup.bapttf.com/repository: archives
  annotations:
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: immich-archives
  volumeName: immich-archives
  resources:
    requests:
      storage: 1Ti
