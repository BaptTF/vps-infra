apiVersion: v1
kind: Service
metadata:
  name: archive-index
  namespace: archive-index
  labels:
    app: archive-index
spec:
  selector:
    app: archive-index
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: http-metrics
      port: 8081
      targetPort: http-metrics
      protocol: TCP
