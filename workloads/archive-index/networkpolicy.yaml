# Prometheus scrapes metrics. The lookup API is reached with kubectl port-forward.
# Postgres is the shared CNPG cluster; DNS is required to resolve it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: archive-index
  namespace: archive-index
spec:
  podSelector:
    matchLabels:
      app: archive-index
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
