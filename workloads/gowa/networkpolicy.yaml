apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gowa
  namespace: gowa
spec:
  podSelector:
    matchLabels:
      app: gowa
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openclaw
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [hermes-leo, hermes-lea]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/parent-resource: gowa
              tailscale.com/parent-resource-ns: gowa
      ports:
        - protocol: TCP
          port: 3000
