apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabron
  namespace: fabron
  labels:
    app: fabron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fabron
  template:
    metadata:
      labels:
        app: fabron
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.5-alpine
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 16Mi
              cpu: 5m
            limits:
              memory: 64Mi
              cpu: 100m
      volumes:
        - name: nginx-config
          configMap:
            name: fabron-nginx
