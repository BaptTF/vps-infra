model:
  provider: custom
  default: opencode-go/deepseek-v4-flash
  base_url: http://bifrost.openclaw.svc.cluster.local:8080/v1
  api_key: dummy
  api_mode: chat_completions
approvals:
  mode: false
terminal:
  backend: local
  timeout: 180
compression:
  enabled: true
  threshold: 0.5
memory:
  memory_enabled: true
  user_profile_enabled: true
telegram:
  require_mention: false

# Brave est search-only (pas de web_extract) : on le pinne uniquement sur
# search_backend et on laisse extract_backend vide pour que web_extract retombe
# sur l'anneau keyless (exa/parallel/tavily/firecrawl/keenable).
# La clé BRAVE_SEARCH_API_KEY arrive par envFrom (secret nullclaw-leo-secret,
# path Infisical /agents/nullclaw-leo).
web:
  search_backend: "brave-free"

delegation:
  provider: custom
  model: opencode-go/deepseek-v4-flash
auxiliary:
  vision:
    provider: custom
    model: opencode-go/deepseek-v4-flash-vision-exp
    base_url: http://bifrost.openclaw.svc.cluster.local:8080/v1
    api_key: dummy
    api_mode: chat_completions
display:
  tool_progress: all
agent:
  verify_on_stop: false
plugins:
  enabled: []
_config_version: 33
onboarding:
  seen:
    busy_input_prompt: true
tts:
  provider: edge
stt:
  provider: openai
  model: groq-whisper
  base_url: http://bifrost.openclaw.svc.cluster.local:8080/v1
  api_key: dummy
