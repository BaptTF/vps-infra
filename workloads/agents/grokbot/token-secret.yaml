# Long-lived token for the external Grok Bot (PR Infra), filled by the token controller.
# Revoke: delete this Secret (or the SA) and let ArgoCD re-create it to rotate.
apiVersion: v1
kind: Secret
metadata:
  name: grokbot-token
  namespace: openclaw
  annotations:
    kubernetes.io/service-account.name: grokbot
type: kubernetes.io/service-account-token
