apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bifrost
spec:
  podSelector:
    matchLabels:
      app: bifrost
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [hermes-leo, hermes-lea, hermes-lya]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vulcain
          podSelector:
            matchLabels:
              app: vulcain
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opencode-dashboard
          podSelector:
            matchLabels:
              app: opencode-dashboard
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/parent-resource: bifrost
              tailscale.com/parent-resource-ns: openclaw
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
    # Only Prometheus may scrape the weight sidecar. Other Bifrost clients keep
    # their existing access on 8080 and cannot reach this additional port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9091
