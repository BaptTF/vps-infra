apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bifrost
  labels:
    app: bifrost
  annotations:
    tailscale.com/tags: tag:bifrost
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - bifrost
  # No defaultBackend: the Tailscale operator registers it at "/", which would
  # keep serving the embedded dashboard. v2.5.x has no flag or config key to
  # disable the UI itself, so only inference (+ /health) is exposed here.
  # In-cluster clients and the weights sidecar are unchanged (Service / localhost).
  rules:
    - http:
        paths:
        - path: /health
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        # Bifrost >= v2.6.0 serves POST /v1/mcp, which exposes the admin /api as
        # MCP tools. /api is deliberately not exposed, so /v1/mcp (and sub-paths)
        # is sent to a Service with no endpoints: longest prefix wins over /v1,
        # the connection is refused and the request never reaches Bifrost.
        # The MCP gateway on /mcp is unaffected.
        - path: /v1/mcp
          pathType: Prefix
          backend:
            service:
              name: bifrost-blocked
              port:
                number: 8080
        - path: /v1
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /openai
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /anthropic
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /genai
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /cohere
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /azure
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /bedrock
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /litellm
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /langchain
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /pydanticai
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /typesafe
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /cursor
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /mcp
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /openai_passthrough
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /anthropic_passthrough
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /azure_passthrough
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /bedrock_passthrough
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /sagemaker_passthrough
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /runware_passthrough
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /genai_passthrough
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
        - path: /chatgpt_passthrough
          pathType: Prefix
          backend:
            service:
              name: bifrost
              port:
                number: 8080
---
# Selector-less Service with no endpoints, used as a sink for ingress paths that
# must not reach Bifrost (see /v1/mcp above).
apiVersion: v1
kind: Service
metadata:
  name: bifrost-blocked
  labels:
    app: bifrost
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8080
