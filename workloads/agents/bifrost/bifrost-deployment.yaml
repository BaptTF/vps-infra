apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost
  labels:
    app: bifrost  
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: bifrost
  template:
    metadata:
      labels:
        app: bifrost
    spec:
      containers:
        - name: bifrost
          image: maximhq/bifrost:v2.0.0
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: APP_DIR
              value: "/app/data"
            - name: APP_PORT
              value: "8080"
            - name: APP_HOST
              value: "0.0.0.0"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_STYLE
              value: "json"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3 
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: bifrost-secret
            - secretRef:
                name: hermes-lya-secret-bifrost
          volumeMounts:
            - name: config-volume
              mountPath: /app/data/config.json
              subPath: config.json

        # Sidecar : rééquilibre dynamiquement les poids opencode-go de Bifrost
        - name: bifrost-weights
          image: ghcr.io/rjullien/bifrost-weight-sidecar:main
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: OPENCODE_GO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secret
                  key: OPENCODE_GO_API_KEY
            - name: OPENCODE_GO_API_KEY_R
              valueFrom:
                secretKeyRef:
                  name: bifrost-secret
                  key: OPENCODE_GO_API_KEY_R
            - name: OPENCODE_GO_API_KEY_A
              valueFrom:
                secretKeyRef:
                  name: bifrost-secret
                  key: OPENCODE_GO_API_KEY_A
            - name: OPENCODE_GO_API_KEY_N
              valueFrom:
                secretKeyRef:
                  name: bifrost-secret
                  key: OPENCODE_GO_API_KEY_N
            - name: BIFROST_URL
              value: http://127.0.0.1:8080
            - name: DRY_RUN
              value: "true"
          resources:
            requests:
              cpu: "5m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: config-volume
          configMap:
            name: bifrost-config
