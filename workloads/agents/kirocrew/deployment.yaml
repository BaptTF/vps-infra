apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirocrew
  namespace: openclaw
  labels:
    app: kirocrew
spec:
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kirocrew
  template:
    metadata:
      labels:
        app: kirocrew
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-config
          image: busybox:1.38.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              cfg=/home/kirocrew/.kiro/crew/config.json
              if [ ! -f "$cfg" ]; then
                mkdir -p /home/kirocrew/.kiro/crew
                printf '%s\n' '{"agent":{"sandbox":"auto","sandbox_allow_unsandboxed_exec":true},"dashboard":{"url":"https://kirocrew.tail4c7c90.ts.net"}}' > "$cfg"
              fi
          volumeMounts:
            - name: home
              mountPath: /home/kirocrew
      containers:
        - name: kirocrew
          image: ghcr.io/rjullien/kirocrew-config/kirocrew:v2026.9.20
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: KIROCREW_ALLOW_UNSANDBOXED
              value: "1"
            - name: KIROCREW_PORT
              value: "5476"
            - name: KIROCREW_BIND
              value: "0.0.0.0"
            - name: KIROCREW_CORS_ORIGINS
              value: "https://kirocrew.tail4c7c90.ts.net"
          ports:
            - containerPort: 5476
              name: dashboard
              protocol: TCP
          volumeMounts:
            - name: home
              mountPath: /home/kirocrew
          startupProbe:
            httpGet:
              path: /api/ready
              port: dashboard
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /api/live
              port: dashboard
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: dashboard
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: kirocrew-home
