apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  labels:
    app: searxng
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      enableServiceLinks: false
      initContainers:
        - name: settings
          image: busybox:1.38.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cp /src/settings.yml /out/settings.yml
              if [ -s /secret/OPEN_METRICS ]; then
                pw=$(cat /secret/OPEN_METRICS)
                # Also reject CR/LF: they would break the generated YAML.
                crlf="$(printf '\r\n_')"; crlf="${crlf%_}"
                case "$pw" in
                  *\"*|*\\*|*" "*|*["$crlf"]*)
                    echo "OPEN_METRICS contains a character the config writer rejects" >&2
                    exit 1
                    ;;
                esac
                printf '\ngeneral:\n  open_metrics: "%s"\n' "$pw" >> /out/settings.yml
              fi
          volumeMounts:
            - name: searxng-config-src
              mountPath: /src
              readOnly: true
            - name: settings
              mountPath: /out
            - name: metrics-secret
              mountPath: /secret
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
      containers:
        - name: searxng
          image: searxng/searxng:2026.9.11-ffe96f8a6
          env:
            - name: SEARXNG_BASE_URL
              value: "http://searxng.openclaw.svc.cluster.local:8080"
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: SEARXNG_SECRET
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
      volumes:
        - name: searxng-config-src
          configMap:
            name: searxng-config
        - name: settings
          emptyDir: {}
        - name: metrics-secret
          secret:
            secretName: searxng-secret
            optional: true
