# Lets grokbot create k8up Restore and Backup objects (and delete finished ones). Nothing else writable.
# They are applied imperatively, never committed to git, and only after Baptiste's explicit approval.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grokbot-k8up
rules:
  - apiGroups: ["k8up.io"]
    resources: ["restores", "backups"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grokbot-k8up
subjects:
  - kind: ServiceAccount
    name: grokbot
    namespace: openclaw
roleRef:
  kind: ClusterRole
  name: grokbot-k8up
  apiGroup: rbac.authorization.k8s.io
