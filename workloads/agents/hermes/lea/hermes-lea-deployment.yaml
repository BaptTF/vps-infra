apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-lea
  namespace: openclaw
  labels:
    app: hermes-lea
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    # Recreate : flock exclusif du gateway sur le PVC RWO
    type: Recreate
  selector:
    matchLabels:
      app: hermes-lea
  template:
    metadata:
      labels:
        app: hermes-lea
    spec:
      hostUsers: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: hermes-lea
      initContainers:
        - name: init-config
          image: alpine/git:2.54.0
          securityContext:
            allowPrivilegeEscalation: false
          command: ["/bin/sh", "/scripts/init-skills.sh"]
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: skills-deploy-key
              mountPath: /deploy-key
              readOnly: true
            - name: init-skills
              mountPath: /scripts
              readOnly: true
            - name: data
              mountPath: /opt/data
      containers:
        - name: hermes-lea
          image: ghcr.io/rjullien/hermes-leo-config/hermes-leo-custom:v2026.11.11.1
          securityContext:
            allowPrivilegeEscalation: false
          args: ["gateway", "run"]
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-lea-secret
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_ALLOWED_USERS
              value: "974020023,8726326688,1156623391,8761164341,8348834293,8701879507,8920294477"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-lea-secret
                  key: API_SERVER_KEY
            - name: BIFROST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-lea-secret-bifrost
                  key: BIFROST_API_KEY
            - name: PATH
              value: "/opt/data/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: CAMOFOX_URL
              value: "http://camofox:9377"
          ports:
            - containerPort: 8642
              name: http
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt/data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "1.5Gi"
              cpu: "500m"
        # Tokens par utilisateur, lus dans state.db (lecture seule).
        - name: usage-exporter
          image: python:3.15.2-alpine
          command: ["python3", "/app/usage-exporter.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: AGENT_NAME
              value: lea
            - name: HERMES_DATA
              value: /opt/data
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 9464
              name: metrics
              protocol: TCP
          volumeMounts:
            - name: usage-exporter
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /opt/data
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          resources:
            requests:
              memory: "24Mi"
              cpu: "5m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: usage-exporter
          configMap:
            name: hermes-lea-usage-exporter
        - name: config-template
          configMap:
            name: hermes-lea-config
        - name: skills-deploy-key
          secret:
            secretName: agents-skills-deploy-key
            defaultMode: 0400
        - name: init-skills
          configMap:
            name: hermes-init-skills
        - name: data
          persistentVolumeClaim:
            claimName: hermes-lea-data
