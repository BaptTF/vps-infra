# 20Gi : local-path ne sait pas agrandir un PVC existant (l'ancien
# nullclaw-leo-data était déclaré 2Gi avec ~11G réels). Migration terminée le
# 2026-11-13, l'ancien volume a été supprimé avec ce changement.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-leo-data
  namespace: openclaw
  annotations:
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
