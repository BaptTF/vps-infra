apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - clusterrolebinding.yaml
  - infisical-secret.yaml
  - hermes-leo-pvc.yaml
  - hermes-leo-deployment.yaml
  - hermes-leo-service.yaml
  - tailscale-ingress.yaml
  - tailscale-egress.yaml

configMapGenerator:
  - name: hermes-leo-config
    files:
      - config.yaml=config.yaml
  - name: hermes-leo-usage-exporter
    files:
      - usage-exporter.py=usage-exporter.py
  # Passwd minimal pour init-config lancé en uid 10000 : ssh sort en erreur
  # (getpwuid) si l'uid courant n'a pas d'entrée, et alpine/git n'en a pas.
  - name: hermes-leo-init-passwd
    files:
      - passwd=init-passwd
