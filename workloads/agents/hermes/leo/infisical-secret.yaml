apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: hermes-leo-bifrost-infisical-secret
  namespace: openclaw
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: https://app.infisical.com/api
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: infrastructure
        envSlug: prod
        secretsPath: /agents/bifrost/virtual-keys
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: hermes-leo-secret-bifrost
      secretNamespace: openclaw
      secretType: Opaque
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          BIFROST_API_KEY: "{{ .BIFROST_VK_HERMES_LEO.Value }}"
