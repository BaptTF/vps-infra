model:
  provider: custom
  default: opencode-go/deepseek-v4.1-flash
  base_url: http://bifrost.openclaw.svc.cluster.local:8080/v1
  api_key: ${BIFROST_API_KEY}
  api_mode: chat_completions
providers:
  bifrost:
    base_url: http://bifrost.openclaw.svc.cluster.local:8080/v1
    api_key: ${BIFROST_API_KEY}
    api_mode: chat_completions
    session_affinity_header: x-bf-eh-x-opencode-session
approvals:
  mode: false
terminal:
  backend: local
  timeout: 180
compression:
  enabled: true
  threshold: 0.5
memory:
  memory_enabled: true
  user_profile_enabled: true
telegram:
  require_mention: false
platforms:
  telegram:
    extra:
      # Ne pas jeter les messages reçus pendant un redémarrage : ils sont
      # traités au démarrage suivant (défaut amont : true = jetés).
      drop_pending_on_cold_boot: false
display:
  tool_progress: all
web:
  search_backend: perplexity
agent:
  verify_on_stop: false
  # Depuis hermes-agent 0.22.7, Camofox a quitté le core : le backend intégré
  # (toolset `browser`, outil browser_exec) est remplacé par le plugin
  # `camofox`, installé sur le PVC dans /opt/data/plugins/camofox.
  disabled_toolsets:
    - browser
plugins:
  enabled:
    # L'initContainer réécrit config.yaml à chaque démarrage : sans cette
    # ligne, le plugin reste installé mais désactivé (plus aucun outil browser).
    - camofox
_config_version: 33
onboarding:
  seen:
    busy_input_prompt: true
tts:
  provider: edge
stt:
  provider: openai
  model: groq-whisper
  base_url: http://bifrost.openclaw.svc.cluster.local:8080/v1
  api_key: ${BIFROST_API_KEY}
