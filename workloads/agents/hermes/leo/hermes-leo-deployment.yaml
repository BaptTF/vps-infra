apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-leo
  namespace: openclaw
  labels:
    app: hermes-leo
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    # RollingUpdate avec passage de relais (image hermes-leo-custom >= relais) :
    # le nouveau pod se prépare pendant que l'ancien répond, passe Ready en
    # standby (cont-init 019-gateway-handoff), K8s arrête l'ancien, le
    # gateway.lock (flock, PVC local-path = même nœud) se libère, le nouveau
    # gateway démarre. Retour arrière : HERMES_HANDOFF_DISABLE=1 ou revert.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hermes-leo
  template:
    metadata:
      labels:
        app: hermes-leo
    spec:
      hostUsers: false
      # SIGTERM → le gateway s'arrête et libère gateway.lock ; 45 s de marge
      # avant SIGKILL (le relais attend cette libération).
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # Les volumes sont déjà à hermes:hermes (10000:10000). fsGroup permet à
        # init-config (non-root) de lire la deploy key montée en 0440 sans
        # lancer un chown récursif du PVC (OnRootMismatch : le groupe de la
        # racine correspond déjà).
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: hermes-leo
      initContainers:
        - name: init-config
          image: alpine/git:2.54.0
          # uid 10000 : /opt/data et /opt/data/skills lui appartiennent déjà,
          # le script n'a pas besoin d'un autre uid pour écrire.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "/scripts/init-skills.sh"]
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: skills-deploy-key
              mountPath: /deploy-key
              readOnly: true
            - name: init-skills
              mountPath: /scripts
              readOnly: true
            - name: init-passwd
              mountPath: /etc/passwd
              subPath: passwd
              readOnly: true
            - name: data
              mountPath: /opt/data
      containers:
        - name: hermes-leo
          image: ghcr.io/rjullien/hermes-leo-config/hermes-leo-custom:v2026.11.14
          # Pas de capabilities.drop: [ALL] ici : l'image démarre root pour que
          # s6-rc (cont-init 01/015/02) chown /run et /opt/data puis passe aux
          # services sous l'utilisateur hermes (SETUID/SETGID). Le pod tourne
          # dans un user namespace (hostUsers: false), donc root y est déjà
          # remappé ; le namespace enforce baseline. Passer à restricted
          # demande de changer l'image (s6 sans root), pas le manifest.
          securityContext:
            allowPrivilegeEscalation: false
          args: ["gateway", "run"]
          envFrom:
            - secretRef:
                name: hermes-leo-secret
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-leo-secret-init
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_ALLOWED_USERS
              value: "974020023,8726326688,1156623391,8761164341,8348834293,8701879507,8920294477"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-leo-secret-api
                  key: API_SERVER_KEY
            - name: BIFROST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-leo-secret-bifrost
                  key: BIFROST_API_KEY
            - name: NULLCLAW_WHATSMEOW_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-leo-secret-bridge
                  key: WHATSMEOW_BRIDGE_TOKEN
                  optional: true
            - name: PATH
              value: "/opt/data/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: CAMOFOX_URL
              value: "http://camofox:9377"
            - name: SEARXNG_URL
              value: "http://searxng.openclaw.svc.cluster.local:8080"
          ports:
            - containerPort: 8642
              name: http
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt/data
          # hermes-probe (dans l'image) : OK en standby (relais en attente de
          # gateway.lock), sinon curl /health:8642 comme avant.
          # ⚠️ Absent des images antérieures au relais : ne pas combiner ces
          # sondes avec un tag plus ancien.
          livenessProbe:
            exec:
              command: ["hermes-probe"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["hermes-probe"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            exec:
              command: ["hermes-probe"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "50m"
            limits:
              memory: "2560Mi"
              cpu: "500m"
        # Tokens par utilisateur, lus dans state.db (lecture seule)
        - name: usage-exporter
          image: python:3.15.2-alpine
          command: ["python3", "/app/usage-exporter.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: AGENT_NAME
              value: leo
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 9464
              name: metrics
              protocol: TCP
          volumeMounts:
            - name: usage-exporter
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          resources:
            requests:
              memory: "24Mi"
              cpu: "5m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: usage-exporter
          configMap:
            name: hermes-leo-usage-exporter
        - name: config-template
          configMap:
            name: hermes-leo-config
        - name: skills-deploy-key
          secret:
            secretName: agents-skills-deploy-key
            # 0440 + fsGroup 10000 : lisible par init-config non-root.
            defaultMode: 0440
        - name: init-skills
          configMap:
            name: hermes-init-skills
        - name: init-passwd
          configMap:
            name: hermes-leo-init-passwd
            items:
              - key: passwd
                path: passwd
        - name: data
          persistentVolumeClaim:
            claimName: hermes-leo-data
