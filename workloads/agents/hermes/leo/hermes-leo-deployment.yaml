apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-leo
  namespace: openclaw
  labels:
    app: hermes-leo
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    # Recreate pendant la migration nullclaw-leo-data -> hermes-leo-data :
    # l'ancien pod doit être arrêté avant la copie (state.db au repos), et le
    # relais par gateway.lock ne marche pas entre deux volumes différents
    # (deux gateways en même temps). Le RollingUpdate avec passage de relais
    # (maxSurge 1, maxUnavailable 0) revient dans la PR de nettoyage.
    type: Recreate
  selector:
    matchLabels:
      app: hermes-leo
  template:
    metadata:
      labels:
        app: hermes-leo
    spec:
      hostUsers: false
      # SIGTERM → le gateway s'arrête et libère gateway.lock ; 45 s de marge
      # avant SIGKILL (le relais attend cette libération).
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: hermes-leo
      initContainers:
        # Migration unique vers hermes-leo-data (20Gi). Copie depuis l'ancien
        # volume monté en lecture seule, sans camoufox (inutile : Camoufox
        # tourne dans son propre pod). Idempotent : ne fait rien si le
        # marqueur existe déjà. À retirer dans la PR de nettoyage.
        - name: migrate-data
          image: alpine/git:2.54.0
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              marker=/new/.migrated-from-nullclaw-leo-data
              if [ -f "$marker" ]; then
                echo "migration déjà faite ($(cat "$marker")), rien à copier"
                exit 0
              fi
              echo "copie /old -> /new (sans camoufox)"
              cd /old
              for e in * .[!.]* ..?*; do
                [ -e "$e" ] || [ -L "$e" ] || continue
                case "$e" in camoufox|lost+found) echo "ignoré : $e"; continue ;; esac
                cp -a "/old/$e" /new/
              done
              sync
              du -sh /new
              date -u +%Y-%m-%dT%H:%M:%SZ > "$marker"
              echo "migration terminée"
          volumeMounts:
            - name: old-data
              mountPath: /old
              readOnly: true
            - name: data
              mountPath: /new
        - name: init-config
          image: alpine/git:2.54.0
          securityContext:
            allowPrivilegeEscalation: false
          command: ["/bin/sh", "/scripts/init-skills.sh"]
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: skills-deploy-key
              mountPath: /deploy-key
              readOnly: true
            - name: init-skills
              mountPath: /scripts
              readOnly: true
            - name: data
              mountPath: /opt/data
      containers:
        - name: hermes-leo
          image: ghcr.io/rjullien/hermes-leo-config/hermes-leo-custom:v2026.11.13.1
          securityContext:
            allowPrivilegeEscalation: false
          args: ["gateway", "run"]
          envFrom:
            - secretRef:
                name: nullclaw-leo-secret
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nullclaw-leo-secret-init
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_ALLOWED_USERS
              value: "974020023,8726326688,1156623391,8761164341,8348834293,8701879507,8920294477"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: nullclaw-leo-secret-api
                  key: API_SERVER_KEY
            - name: BIFROST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-leo-secret-bifrost
                  key: BIFROST_API_KEY
            - name: NULLCLAW_WHATSMEOW_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nullclaw-leo-secret-bridge
                  key: WHATSMEOW_BRIDGE_TOKEN
                  optional: true
            - name: PATH
              value: "/opt/data/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: CAMOFOX_URL
              value: "http://camofox:9377"
            - name: SEARXNG_URL
              value: "http://searxng.openclaw.svc.cluster.local:8080"
          ports:
            - containerPort: 8642
              name: http
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt/data
          # hermes-probe (dans l'image) : OK en standby (relais en attente de
          # gateway.lock), sinon curl /health:8642 comme avant.
          # ⚠️ Absent des images antérieures au relais : ne pas combiner ces
          # sondes avec un tag plus ancien.
          livenessProbe:
            exec:
              command: ["hermes-probe"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["hermes-probe"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            exec:
              command: ["hermes-probe"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "1.5Gi"
              cpu: "500m"
        # Tokens par utilisateur, lus dans state.db (lecture seule)
        - name: usage-exporter
          image: python:3.15.2-alpine
          command: ["python3", "/app/usage-exporter.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: AGENT_NAME
              value: leo
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 9464
              name: metrics
              protocol: TCP
          volumeMounts:
            - name: usage-exporter
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          resources:
            requests:
              memory: "24Mi"
              cpu: "5m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: usage-exporter
          configMap:
            name: hermes-leo-usage-exporter
        - name: config-template
          configMap:
            name: hermes-leo-config
        - name: skills-deploy-key
          secret:
            secretName: agents-skills-deploy-key
            defaultMode: 0400
        - name: init-skills
          configMap:
            name: hermes-init-skills
        - name: data
          persistentVolumeClaim:
            claimName: hermes-leo-data
        # Ancien volume, lu seulement par migrate-data (lecture seule).
        - name: old-data
          persistentVolumeClaim:
            claimName: nullclaw-leo-data
            readOnly: true
