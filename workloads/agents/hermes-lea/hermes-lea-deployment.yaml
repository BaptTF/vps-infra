apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-lea
  namespace: openclaw
  labels:
    app: hermes-lea
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hermes-lea
  template:
    metadata:
      labels:
        app: hermes-lea
    spec:
      serviceAccountName: hermes-lea
      initContainers:
        - name: init-config
          image: busybox:1.38.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /config-template/config.yaml /opt/data/config.yaml
              mkdir -p /opt/data/skills
              cd /skills-in
              for skill in *; do
                mkdir -p "/opt/data/skills/$skill"
                cp "/skills-in/$skill" "/opt/data/skills/$skill/SKILL.md"
              done
              chown -R 10000:10000 /opt/data/config.yaml /opt/data/skills
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: skills
              mountPath: /skills-in
              readOnly: true
            - name: data
              mountPath: /opt/data
      containers:
        - name: hermes-lea
          image: ghcr.io/rjullien/hermes-leo-config/hermes-leo-custom:v2026.9.18
          args: ["gateway", "run"]
          envFrom:
            - secretRef:
                name: hermes-lea-secret
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-lea-secret
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_ALLOWED_USERS
              value: "CHAT_ID_PLACEHOLDER"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: "https://auth.bapttf.com"
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: "hermes-lea-dashboard"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: "https://hermes-lea.bapttf.com"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-lea-secret
                  key: API_SERVER_KEY
            - name: PATH
              value: "/opt/data/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: CAMOFOX_URL
              value: "http://camofox:9377"
          ports:
            - containerPort: 8642
              name: http
              protocol: TCP
            - containerPort: 9119
              name: dashboard
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: devin-credentials
              mountPath: /opt/data/home/.local/share/devin/credentials.toml
              subPath: credentials.toml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "1.5Gi"
              cpu: "500m"
      volumes:
        - name: config-template
          configMap:
            name: hermes-lea-config
        - name: skills
          configMap:
            name: hermes-lea-skills
        - name: data
          persistentVolumeClaim:
            claimName: hermes-lea-data
        - name: devin-credentials
          secret:
            secretName: hermes-lea-secret-devin
            optional: true
