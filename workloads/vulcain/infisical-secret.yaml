apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: vulcain-bifrost-infisical-secret
  namespace: vulcain
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: https://app.infisical.com/api
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: infrastructure
        envSlug: prod
        secretsPath: /agents/bifrost/virtual-keys
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: vulcain-secret-bifrost
      secretNamespace: vulcain
      secretType: Opaque
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          BIFROST_API_KEY: "{{ .BIFROST_VK_VULCAIN.Value }}"
