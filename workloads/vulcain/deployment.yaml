apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulcain
  namespace: vulcain
  labels:
    app: vulcain
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulcain
  template:
    metadata:
      labels:
        app: vulcain
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vulcain
          image: ghcr.io/bapttf/vulcain
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7331
          env:
            # Un service nommé "vulcain" fait injecter par le kubelet
            # VULCAIN_PORT=tcp://<ip>:7331, que l'app essaie de parser en nombre
            - name: VULCAIN_PORT
              value: "7331"
            # Virtual key Bifrost, référencée par llm.provider.apiKey: "${BIFROST_API_KEY}"
            # dans /data/.vulcain/config/config.json (PVC)
            - name: BIFROST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vulcain-secret-bifrost
                  key: BIFROST_API_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 1Gi
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /api/meta
              port: 7331
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/meta
              port: 7331
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vulcain-data
